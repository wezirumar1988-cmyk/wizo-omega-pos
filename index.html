<html lang="en">
<head>

<style>
:root{--bg:#0b100e;--panel:#151e19;--panel2:#1b2921;--line:#304137;--gold:#e6c35c;--text:#f7f5ec;--muted:#a7b5aa;--lime:#75ec19;--cyan:#20d6d2;--blue:#3567f5;--pink:#f34c9a;--red:#ff5b45}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #425248;border-radius:9px;padding:10px 12px;background:#243229;color:var(--text)}button:hover{filter:brightness(1.12)}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;padding:10px;background:#0e1511;border:1px solid #3a4a40;border-radius:8px;color:white}label{display:block;font-size:12px;color:var(--muted);margin:9px 0 5px}h1,h2,h3,p{margin-top:0}.gold{color:var(--gold)}.muted{color:var(--muted)}.primary{background:var(--gold);color:#17170f;border-color:var(--gold);font-weight:800}.danger{background:#54251f;border-color:#8e4236}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#243c2a,#0b100e 65%)}.authcard{width:min(100%,440px);padding:30px;border:1px solid #475344;border-radius:20px;background:#141d17;box-shadow:0 20px 70px #0008}.logo{display:inline-grid;place-items:center;width:54px;height:54px;border:2px solid var(--gold);border-radius:15px;color:var(--gold);font-weight:900;font-size:20px}.tabs{display:flex;gap:6px;margin:18px 0}.tabs button{flex:1}.tabs .active{background:var(--gold);color:#111}.msg{min-height:20px;color:var(--gold);font-size:13px;margin-top:12px}.shell[hidden],.auth[hidden]{display:none!important}.shell{display:grid;grid-template-columns:215px minmax(0,1fr);min-height:100vh}aside{background:#101713;border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:15px}.brand{font-weight:900;color:var(--gold);font-size:17px;padding:10px 5px}nav{display:grid;gap:6px}nav button{text-align:left;background:transparent;border-color:transparent;color:#d1d8d0}nav button.active,nav button:hover{background:#2a352b;border-color:#475746;color:var(--gold)}.sidefoot{margin-top:auto}.main{padding:14px 22px 22px;min-width:0;max-width:1700px;width:100%;margin:0 auto;align-self:start}.topbar{margin-top:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.topbar h2{margin:0;font-size:25px}.chip{border:1px solid var(--line);border-radius:22px;padding:8px 12px;color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;min-width:0}.stat small{color:var(--muted)}.stat strong{display:block;font-size:23px;margin-top:8px;overflow-wrap:anywhere}.layout2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted)}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed #3b4a3e;border-radius:9px}.pos{display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(300px,1fr);gap:14px}.categories{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.categories button{font-size:12px;padding:8px 10px}.menuitems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.menuitem{min-height:68px;text-align:center;font-weight:800;background:var(--lime);color:#15220d;border:0}.menuitem:nth-child(5n+2){background:var(--cyan);color:#102222}.menuitem:nth-child(5n+3){background:var(--blue);color:#fff}.menuitem:nth-child(5n+4){background:#42cf82;color:#10281a}.menuitem:nth-child(5n){background:var(--pink);color:#321222}.cartrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:7px;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}.cartrow button{padding:5px 9px}.total{font-size:22px;color:var(--gold);font-weight:900}.actionbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actionbar button{flex:1}.hidden{display:none!important}.notice{padding:10px 12px;background:#26372a;border:1px solid #4b654d;border-radius:9px;margin-bottom:12px;color:#d9f1d5}.receipt{background:#fff;color:#17211b;padding:22px 18px;width:100%;max-width:360px;margin:0 auto;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.45;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 8px 24px #0001}.receipt .receipt-brand{text-align:center;border-bottom:1px dashed #9ca3af;padding-bottom:12px;margin-bottom:12px}.receipt .receipt-brand h2{font-size:20px;letter-spacing:.5px;margin:0 0 5px;color:#111827;overflow-wrap:anywhere}.receipt .receipt-brand p{margin:2px 0;color:#4b5563;overflow-wrap:anywhere}.receipt .receipt-meta{display:grid;gap:4px;margin:10px 0}.receipt .receipt-meta div{display:flex;justify-content:space-between;gap:12px}.receipt .receipt-meta span:first-child{color:#6b7280}.receipt .receipt-items{width:100%;border-collapse:collapse;margin:10px 0}.receipt .receipt-items th{font-size:10px;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #d1d5db;padding:6px 2px}.receipt .receipt-items td{padding:8px 2px;border-bottom:1px dashed #e5e7eb;white-space:normal}.receipt .receipt-items th:last-child,.receipt .receipt-items td:last-child{text-align:right}.receipt .receipt-totals{border-top:1px dashed #9ca3af;padding-top:9px;margin-top:8px}.receipt .receipt-totals div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.receipt .receipt-totals .grand{font-size:17px;font-weight:800;color:#111827;border-top:1px solid #d1d5db;margin-top:5px;padding-top:9px}.receipt .receipt-thanks{text-align:center;border-top:1px dashed #9ca3af;margin-top:14px;padding-top:12px;color:#374151}.receipt .receipt-print{display:block;margin:12px auto 0;background:#e5e7eb;color:#111827;border:1px solid #d1d5db}.receipt .receipt-print{display:none}@media(max-width:900px){.shell{grid-template-columns:1fr}aside{padding:10px}.sidefoot{margin-top:0}nav{display:flex;overflow:auto}nav button{white-space:nowrap}.main{padding:13px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.pos,.layout2{grid-template-columns:1fr}}@media(max-width:480px){.formgrid{grid-template-columns:1fr}.menuitems{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{align-items:flex-start;flex-direction:column}.stat strong{font-size:19px}}
</style>
</head>
<body>
<section id="auth" class="auth"><div class="authcard"><div class="logo">WΩ</div><p class="gold" style="margin-top:16px;letter-spacing:2px;font-size:11px">SALES · INVENTORY · RESTAURANT · BUSINESS</p><h1>WIZO <span class="gold">OMEGA POS</span></h1><p class="muted">Manage your business from one place.</p><div class="tabs"><button id="signinTab" class="active" type="button">Sign in</button><button id="signupTab" type="button">Create account</button></div><form id="authForm"><div id="businessField" class="hidden"><label>Business / Restaurant name</label><input id="businessName" autocomplete="organization" placeholder="Your business name"></div><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters"><button id="authSubmit" class="primary" style="width:100%;margin-top:16px" type="submit">Sign in</button><div id="authMsg" class="msg"></div></form></div></section>
<div id="shell" class="shell" hidden><aside><div class="brand">WΩ WIZO OMEGA</div><nav id="nav"><button data-page="Dashboard" class="active">▦ Dashboard</button><button data-page="POS">▣ POS / New Sale</button><button data-page="Products">◫ Menu</button><button data-page="Purchases">⇩ Purchases</button><button data-page="Expenses">↗ Expenses</button><button data-page="Customers">♙ Customers</button><button data-page="Suppliers">♧ Suppliers</button><button data-page="Sales">▤ Sales History</button><button data-page="Reports">▥ Reports</button><button data-page="Cashier Management">♙ Cashier Management</button><button data-page="Budget">▤ Budget</button><button data-page="Settings">⚙ Settings</button></nav><div class="sidefoot"><button id="logout" style="width:100%">Sign out</button></div></aside><main class="main"><div class="topbar"><div><p class="gold" style="font-size:10px;letter-spacing:2px;margin-bottom:4px">BUSINESS MANAGEMENT</p><h2 id="pageTitle">Dashboard</h2></div><span id="businessChip" class="chip">My Business</span></div><div id="appNotice"></div><section id="content"></section></main></div>
<div id="printArea" class="hidden"></div>
<script>
const SUPABASE_URL="https://hgwotfexwdctqjprkbst.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_4SgxZyVh3qSwdFwpPf03CQ_yfF0W95e";
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);let authMode="signin",currentUser=null,business=null,currentRole="owner",products=[],cart=[],pageNow="Dashboard",profile={name:"",phone:"",address:"",logo_url:"",currency:"ETB"};
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:profile.currency||"ETB"}).format(Number(n||0));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function say(id,msg){if($(id))$(id).textContent=msg}
function setAuthMode(m){authMode=m;$("signinTab").classList.toggle("active",m==="signin");$("signupTab").classList.toggle("active",m==="signup");$("businessField").classList.toggle("hidden",m!=="signup");$("businessName").required=m==="signup";$("authSubmit").textContent=m==="signin"?"Sign in":"Create account";say("authMsg",m==="signup"?"Enter your business name, email and password.":"")}
$("signinTab").onclick=()=>setAuthMode("signin");$("signupTab").onclick=()=>setAuthMode("signup");
$("authForm").onsubmit=async e=>{e.preventDefault();if(!db){say("authMsg","Supabase library did not load. Check your internet connection.");return}const btn=$("authSubmit");btn.disabled=true;say("authMsg","Please wait…");try{const email=$("email").value.trim(),password=$("password").value;if(authMode==="signin"){const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await boot()}else{const name=$("businessName").value.trim();if(!name)throw Error("Enter your business name.");const {data,error}=await db.auth.signUp({email,password,options:{data:{business_name:name},emailRedirectTo:location.href.split("#")[0]}});if(error)throw error;if(!data.session){say("authMsg","Account created. Check your email confirmation, then sign in. Business profile will be created automatically after confirmation.");return}await boot()}}catch(err){say("authMsg",err.message||"Could not sign in/create account.")}finally{btn.disabled=false}};
$("logout").onclick=async()=>{await db.auth.signOut();currentUser=null;business=null;currentRole="owner";products=[];cart=[];$("shell").hidden=true;$("auth").hidden=false;setAuthMode("signin")};
$("nav").onclick=e=>{const b=e.target.closest("[data-page]");if(b)showPage(b.dataset.page)};
async function boot(){const {data:{user},error}=await db.auth.getUser();if(error)throw error;if(!user)return;currentUser=user;$("auth").hidden=true;$("shell").hidden=false;await loadBusiness();await showPage("Dashboard")}
async function loadBusiness(){
  const {data:membership,error:memberError}=await db.from("business_members")
    .select("business_id,role").eq("user_id",currentUser.id).limit(1).maybeSingle();
  if(memberError)throw memberError;
  if(!membership)throw Error("Your account is not linked to a business. Ask the business owner to add your account.");
  currentRole=String(membership.role||"cashier").toLowerCase();
  const {data,error}=await db.from("businesses").select("*").eq("id",membership.business_id).maybeSingle();
  if(error)throw error;
  if(!data)throw Error("Business profile not found for your account.");
  business=data;profile={...profile,...data};
  $("businessChip").textContent=(data.name||currentUser.email)+" · "+currentRole.toUpperCase();
  applyRoleAccess();
}
function isOwnerRole(){return ["owner","admin"].includes(currentRole)}
function applyRoleAccess(){
  const allowed=isOwnerRole()?["Dashboard","POS","Products","Purchases","Expenses","Customers","Suppliers","Sales","Reports","Cashier Management","Budget","Settings"]:["POS","Sales"];
  document.querySelectorAll("#nav button[data-page]").forEach(b=>{
    const ok=allowed.includes(b.dataset.page);
    b.hidden=!ok;
    b.disabled=!ok;
  });
  if(!allowed.includes(pageNow))pageNow="POS";
}
function showNotice(msg){$("appNotice").innerHTML=msg?`<div class="notice">${esc(msg)}</div>`:""}
async function showPage(p){
  const cashierAllowed=["POS","Sales"];
  if(!isOwnerRole()&&!cashierAllowed.includes(p)){showNotice("This page is available to Owner/Admin only.");p="POS";}
  pageNow=p;$("pageTitle").textContent=p;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
  showNotice("");
  try{if(p==="Dashboard")await dashboard();else if(p==="POS")await renderPOS();else if(p==="Products")await productsPage();else if(p==="Purchases")await purchasesPage();else if(p==="Expenses")await expensesPage();else if(p==="Customers")await simpleDirectory("Customers");else if(p==="Suppliers")await simpleDirectory("Suppliers");else if(p==="Sales")await salesPage();else if(p==="Reports")await reportsPage();else if(p==="Cashier Management")await cashierManagementPage();else if(p==="Budget")await budgetPage();else if(p==="Settings")settingsPage()}
  catch(err){showNotice(err.message||String(err));$("content").innerHTML=`<div class="panel"><h3>Unable to load this page</h3><p>${esc(err.message||String(err))}</p></div>`}
}
async function q(table,select="*"){const {data,error}=await db.from(table).select(select).order("created_at",{ascending:false});if(error)throw error;return data||[]}
async function dashboard(){const [sales,expenses,prods,purchases]=await Promise.all([q("sales"),q("expenses"),q("products"),q("purchases")]);const totalSales=sales.filter(s=>s.status==="completed").reduce((a,s)=>a+Number(s.total),0),purchaseCost=purchases.reduce((a,s)=>a+Number(s.total_cost),0),expenseCost=expenses.reduce((a,s)=>a+Number(s.amount),0),profit=sales.filter(s=>s.status==="completed").reduce((a,s)=>a+Number(s.total)-Number(s.cost_total||0),0)-expenseCost;const budgetKey=`wizo_budget_${business.id}`,budgetAmount=Math.max(0,Number(localStorage.getItem(budgetKey)||0)),budgetBalance=budgetAmount-purchaseCost;$("content").innerHTML=`<div class="stats"><div class="stat"><small>TOTAL SALES</small><strong>${money(totalSales)}</strong></div><div class="stat"><small>PURCHASE COST</small><strong>${money(purchaseCost)}</strong></div><div class="stat"><small>EST. NET PROFIT</small><strong>${money(profit)}</strong></div><div class="stat"><small>STOCK PRODUCTS</small><strong>${prods.length}</strong></div></div><div class="stats"><div class="stat"><small>BUDGET</small><strong>${money(budgetAmount)}</strong></div><div class="stat"><small>BUDGET PURCHASES</small><strong>${money(purchaseCost)}</strong></div><div class="stat"><small>BUDGET BALANCE</small><strong style="color:${budgetBalance<0?'var(--red)':'var(--lime)'}">${money(budgetBalance)}</strong></div><div class="stat"><small>EXPENSES</small><strong>${money(expenseCost)}</strong></div></div><div class="layout2"><div class="panel"><h3>Recent sales</h3>${tableHTML(sales.slice(0,6),["invoice_number","total","payment_method","created_at"])}</div><div class="panel"><h3>Quick actions</h3><div class="row"><button class="primary" data-goto="POS">＋ New sale</button><button data-goto="Products">＋ Add product</button><button data-goto="Budget">▤ Set budget</button></div><p class="muted" style="margin-top:14px">Inventory items: ${prods.length} · Expenses: ${expenses.length}</p><p class="muted">Budget balance = Budget − Purchases.</p></div></div>`;bindGoto()}
function tableHTML(rows,cols){if(!rows.length)return '<div class="empty">No records yet.</div>';return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c.replaceAll("_"," "))}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c==="total"||c==="amount"||c==="total_cost"?money(r[c]):c==="created_at"?new Date(r[c]).toLocaleString():r[c]??"—")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function bindGoto(){$$(" [data-goto]".trim()).forEach(b=>b.onclick=()=>showPage(b.dataset.goto))}
function $$(s){return document.querySelectorAll(s)}
async function getProducts(){
  const fields=isOwnerRole()
    ?"id,business_id,name,sku,unit,stock_quantity,cost_price,selling_price,low_stock_threshold,created_at,updated_at,category"
    :"id,business_id,name,sku,unit,stock_quantity,selling_price,low_stock_threshold,created_at,updated_at,category";
  const {data,error}=await db.from("products").select(fields).eq("business_id",business.id).order("created_at",{ascending:false});
  if(error)throw error;products=data||[];return products;
}
async function productsPage(){
  const key=`wizo_menu_items_${business.id}`;
  const readMenu=()=>{try{return JSON.parse(localStorage.getItem(key)||"[]")}catch{return []}};
  const renderMenu=()=>{
    const items=readMenu();
    $("menuItemsCount").textContent=`Menu items (${items.length})`;
    $("menuItemsList").innerHTML=items.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px">${items.map(item=>`<article class="panel" style="padding:12px"><div style="height:130px;border-radius:9px;overflow:hidden;background:var(--panel2);display:grid;place-items:center;margin-bottom:10px">${item.image?`<img src="${item.image}" alt="${esc(item.name)}" style="width:100%;height:100%;object-fit:cover">`:`<span class="muted">No picture</span>`}</div><h3 style="margin-bottom:5px">${esc(item.name)}</h3><p class="muted" style="margin-bottom:6px">${esc(item.category||"Other")}</p><strong class="gold">${money(item.price)}</strong>${item.description?`<p class="muted" style="margin-top:8px;margin-bottom:8px">${esc(item.description)}</p>`:""}<p style="margin:8px 0"><span class="chip">${item.available?"Available":"Unavailable"}</span></p><button type="button" class="danger" data-delete-menu="${esc(item.id)}">Delete item</button></article>`).join("")}</div>`:`<div class="empty">No menu items yet. Add your first restaurant item above.</div>`;
    $("menuItemsList").querySelectorAll("[data-delete-menu]").forEach(btn=>btn.onclick=()=>{if(!confirm("Delete this menu item?"))return;localStorage.setItem(key,JSON.stringify(readMenu().filter(x=>x.id!==btn.dataset.deleteMenu)));renderMenu()});
  };
  $("content").innerHTML=`<div class="panel"><h3>＋ Add Menu Item</h3><p class="muted">Add restaurant food and drinks here. Menu items are separate from inventory stock.</p><form id="menuItemForm"><div class="formgrid"><div><label>Menu item name *</label><input name="name" required placeholder="e.g. Chicken Pizza"></div><div><label>Category *</label><select name="category" required><option value="Pizza">Pizza</option><option value="Burger">Burger</option><option value="Shawarma">Shawarma</option><option value="Drinks">Drinks</option><option value="Breakfast">Breakfast</option><option value="Main dishes">Main dishes</option><option value="Dessert">Dessert</option><option value="Other">Other</option></select></div><div><label>Selling price (${esc(profile.currency||"ETB")}) *</label><input name="price" type="number" min="0.01" step=".01" required placeholder="0.00"></div><div><label>Food picture (laptop / phone)</label><input id="menuPicture" name="picture" type="file" accept="image/*"><div id="menuPicturePreview" class="muted" style="margin-top:7px;font-size:12px">Choose an image to preview it.</div></div><div style="grid-column:1/-1"><label>Description (optional)</label><textarea name="description" rows="2" placeholder="Ingredients or short description"></textarea></div><div><label>Availability</label><select name="available"><option value="yes">Available on menu</option><option value="no">Temporarily unavailable</option></select></div></div><button class="primary" style="margin-top:15px" type="submit">Save menu item</button><span id="menuItemMsg" class="msg"></span></form></div><div class="panel"><h3 id="menuItemsCount">Menu items (0)</h3><div id="menuItemsList"></div></div>`;
  let pictureData="";
  $("menuPicture").onchange=e=>{
    const file=e.target.files?.[0];pictureData="";
    if(!file){$("menuPicturePreview").textContent="Choose an image to preview it.";return}
    if(!file.type.startsWith("image/")){e.target.value="";say("menuItemMsg","Please choose an image file.");return}
    if(file.size>2*1024*1024){e.target.value="";say("menuItemMsg","Image must be 2 MB or smaller. Please choose a smaller picture.");return}
    const reader=new FileReader();
    reader.onload=()=>{pictureData=String(reader.result||"");$("menuPicturePreview").innerHTML=`<img src="${pictureData}" alt="Menu picture preview" style="display:block;max-width:180px;max-height:130px;object-fit:cover;border-radius:8px"><span class="muted">Picture selected</span>`};
    reader.onerror=()=>say("menuItemMsg","Could not read this picture. Please try another file.");
    reader.readAsDataURL(file);
  };
  $("menuItemForm").onsubmit=e=>{
    e.preventDefault();
    const f=new FormData(e.currentTarget),name=String(f.get("name")||"").trim(),price=Number(f.get("price"));
    if(!name||!Number.isFinite(price)||price<=0){say("menuItemMsg","Enter a menu name and a valid selling price.");return}
    const items=readMenu();
    items.unshift({id:`${Date.now()}_${Math.random().toString(36).slice(2,8)}`,name,category:String(f.get("category")||"Other"),price,description:String(f.get("description")||"").trim(),image:pictureData,available:f.get("available")==="yes",created_at:new Date().toISOString()});
    try{localStorage.setItem(key,JSON.stringify(items));e.currentTarget.reset();pictureData="";$("menuPicturePreview").textContent="Choose an image to preview it.";say("menuItemMsg","Menu item saved.");renderMenu()}
    catch(err){say("menuItemMsg","Could not save. The browser may be out of storage space; try a smaller picture.");}
  };
  renderMenu();
}
async function reportsPage(){const [sales,expenses,purchases,prods]=await Promise.all([q("sales"),q("expenses"),q("purchases"),q("products")]);const completed=sales.filter(s=>s.status==="completed");const total=completed.reduce((a,s)=>a+Number(s.total),0),cost=completed.reduce((a,s)=>a+Number(s.cost_total||0),0),exp=expenses.reduce((a,s)=>a+Number(s.amount),0);$("content").innerHTML=`<div class="stats"><div class="stat"><small>COMPLETED SALES</small><strong>${money(total)}</strong></div><div class="stat"><small>SALE COST</small><strong>${money(cost)}</strong></div><div class="stat"><small>GROSS PROFIT</small><strong>${money(total-cost)}</strong></div><div class="stat"><small>AFTER EXPENSES</small><strong>${money(total-cost-exp)}</strong></div></div><div class="layout2"><div class="panel"><h3>Purchases</h3><p class="total">${money(purchases.reduce((a,p)=>a+Number(p.total_cost),0))}</p></div><div class="panel"><h3>Inventory value (at cost)</h3><p class="total">${money(prods.reduce((a,p)=>a+Number(p.stock_quantity)*Number(p.cost_price),0))}</p></div></div><div class="panel"><h3>Sales records</h3>${tableHTML(sales,["invoice_number","total","status","created_at"])}</div>`}
async function cashierManagementPage(){
  if(!isOwnerRole())throw Error("Owner/Admin only.");
  const {data:members,error}=await db.from("business_members").select("user_id,role,created_at").eq("business_id",business.id).order("created_at",{ascending:true});
  if(error)throw error;
  const rows=members||[];
  $("content").innerHTML=`<div class="panel"><div class="row" style="align-items:center"><div><h3>Cashier Management</h3><p class="muted">Invite a cashier to this business. A secure Supabase Edge Function must be deployed for invitations to work.</p></div><button class="primary" id="showAddCashier" style="flex:0 0 auto">＋ Add Cashier</button></div><div id="addCashierBox" class="panel hidden" style="margin:14px 0;background:var(--panel2)"><h3>Invite new cashier</h3><form id="addCashierForm"><label>Cashier email address *</label><input id="cashierEmail" name="email" type="email" required placeholder="cashier@example.com"><p class="muted" style="margin-top:8px">An invitation will be sent by the secure backend. The cashier should use their own email to accept it.</p><div class="row"><button class="primary" type="submit" id="inviteCashierBtn">Send invitation</button><button type="button" id="cancelAddCashier">Cancel</button></div><div id="cashierMsg" class="msg"></div></form></div><div class="tablewrap"><table><thead><tr><th>User ID</th><th>Role</th><th>Added</th></tr></thead><tbody>${rows.map(m=>`<tr><td>${esc(m.user_id)}</td><td><span class="chip">${esc(m.role||"cashier")}</span></td><td>${m.created_at?new Date(m.created_at).toLocaleDateString():"—"}</td></tr>`).join("")||`<tr><td colspan="3">No team members found.</td></tr>`}</tbody></table></div><button id="refreshMembers" style="margin-top:12px">Refresh list</button></div>`;
  $("showAddCashier").onclick=()=>{$("addCashierBox").classList.remove("hidden");$("cashierEmail").focus()};
  $("cancelAddCashier").onclick=()=>{$("addCashierBox").classList.add("hidden");say("cashierMsg","")};
  $("refreshMembers").onclick=()=>cashierManagementPage();
  $("addCashierForm").onsubmit=async e=>{
    e.preventDefault();
    const email=$("cashierEmail").value.trim().toLowerCase(),btn=$("inviteCashierBtn");
    if(!email){say("cashierMsg","Enter the cashier email address.");return}
    btn.disabled=true;say("cashierMsg","Sending invitation…");
    try{
      const {data,error}=await db.functions.invoke("wizo-invite-cashier",{body:{business_id:business.id,email}});
      if(error)throw error;
      if(data?.error)throw Error(data.error);
      say("cashierMsg",data?.message||"Invitation request completed. Refresh the list after the cashier accepts.");
      $("cashierEmail").value="";
      await cashierManagementPage();
    }catch(err){
      const message=String(err.message||err);
      if(/404|not found|function.*not.*found|failed to send a request/i.test(message)){
        say("cashierMsg","The Add Cashier form is ready, but the secure Supabase Edge Function 'wizo-invite-cashier' is not deployed/configured yet. No account was created. Do not use client-side sign-up to create cashiers.");
      }else say("cashierMsg","Invitation failed: "+message);
    }finally{if($("inviteCashierBtn"))$("inviteCashierBtn").disabled=false}
  };
}
async function budgetPage(){
  if(!isOwnerRole())throw Error("Owner/Admin only.");
  const [sales,expenses,purchases]=await Promise.all([q("sales"),q("expenses"),q("purchases")]);
  const completed=sales.filter(x=>x.status==="completed");
  const revenue=completed.reduce((a,x)=>a+Number(x.total||0),0),expenseTotal=expenses.reduce((a,x)=>a+Number(x.amount||0),0),purchaseTotal=purchases.reduce((a,x)=>a+Number(x.total_cost||0),0);
  const key=`wizo_budget_${business.id}`,saved=localStorage.getItem(key)||"0",budgetAmount=Math.max(0,Number(saved)||0),balance=budgetAmount-purchaseTotal;
  $("content").innerHTML=`<div class="stats"><div class="stat"><small>BUDGET</small><strong>${money(budgetAmount)}</strong></div><div class="stat"><small>PURCHASES</small><strong>${money(purchaseTotal)}</strong></div><div class="stat"><small>BALANCE (BUDGET − PURCHASES)</small><strong style="color:${balance<0?'var(--red)':'var(--lime)'}">${money(balance)}</strong></div><div class="stat"><small>SALES REVENUE</small><strong>${money(revenue)}</strong></div></div><div class="panel"><h3>Budget planning</h3><p class="muted">Enter your budget amount. Purchases are deducted automatically, and the budget and balance also appear on the Dashboard. This budget amount is saved in this browser only.</p><form id="budgetForm"><label>Budget amount (${esc(profile.currency||"ETB")})</label><input id="budgetTarget" type="number" min="0" step="0.01" value="${esc(saved)}" required><button class="primary" style="margin-top:12px">Save budget</button><span id="budgetMsg" class="msg"></span></form><div style="margin-top:18px"><p>Budget usage</p><div style="height:12px;background:#253129;border-radius:8px;overflow:hidden"><div id="budgetBar" style="height:100%;width:0;background:var(--gold)"></div></div><p id="budgetProgress" class="muted" style="margin-top:8px"></p><button type="button" id="budgetDashboard" style="margin-top:8px">View Dashboard</button></div></div>`;
  const percent=budgetAmount>0?Math.min(100,purchaseTotal/budgetAmount*100):0;
  $("budgetBar").style.width=percent+"%";$("budgetProgress").textContent=budgetAmount>0?`${percent.toFixed(1)}% of budget used · Balance: ${money(balance)}`:"Enter a budget amount to calculate the balance.";
  $("budgetDashboard").onclick=()=>showPage("Dashboard");
  $("budgetForm").onsubmit=e=>{e.preventDefault();const val=Math.max(0,Number($("budgetTarget").value)||0);localStorage.setItem(key,String(val));say("budgetMsg","Budget saved. Dashboard will show the budget and balance.");const pct=val>0?Math.min(100,purchaseTotal/val*100):0;$("budgetBar").style.width=pct+"%";$("budgetProgress").textContent=val>0?`${pct.toFixed(1)}% of budget used · Balance: ${money(val-purchaseTotal)}`:"Enter a budget amount to calculate the balance."};
}
function settingsPage(){$("content").innerHTML=`<div class="panel"><h3>Business / receipt settings</h3><form id="settingsForm"><div class="formgrid"><div><label>Business name</label><input name="name" required value="${esc(profile.name||"")}"></div><div><label>Phone</label><input name="phone" value="${esc(profile.phone||"")}"></div><div><label>Address</label><input name="address" value="${esc(profile.address||"")}"></div><div><label>Currency</label><select name="currency"><option ${profile.currency==="ETB"?"selected":""}>ETB</option><option ${profile.currency==="SAR"?"selected":""}>SAR</option><option ${profile.currency==="USD"?"selected":""}>USD</option></select></div><div style="grid-column:1/-1"><label>Logo image URL (optional)</label><input name="logo_url" value="${esc(profile.logo_url||"")}"></div></div><button class="primary" style="margin-top:14px">Save settings</button><span id="settingsMsg" class="msg"></span></form><p class="muted">These details are used on receipts. The logo URL must be a publicly accessible image URL.</p></div>`;$("settingsForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const {error}=await db.from("businesses").update({name:f.get("name"),phone:f.get("phone")||null,address:f.get("address")||null,currency:f.get("currency"),logo_url:f.get("logo_url")||null}).eq("id",business.id);if(error)throw error;await loadBusiness();say("settingsMsg","Settings saved.")}catch(err){say("settingsMsg",err.message)}}}
(async()=>{if(!db){say("authMsg","Supabase library failed to load. Check internet.");return}const {data:{session}}=await db.auth.getSession();if(session){try{await boot()}catch(err){$("auth").hidden=false;$("shell").hidden=true;say("authMsg",err.message)}}})();
</script>
