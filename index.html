<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #425248;border-radius:9px;padding:10px 12px;background:#243229;color:var(--text)}button:hover{filter:brightness(1.12)}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;padding:10px;background:#0e1511;border:1px solid #3a4a40;border-radius:8px;color:white}label{display:block;font-size:12px;color:var(--muted);margin:9px 0 5px}h1,h2,h3,p{margin-top:0}.gold{color:var(--gold)}.muted{color:var(--muted)}.primary{background:var(--gold);color:#17170f;border-color:var(--gold);font-weight:800}.danger{background:#54251f;border-color:#8e4236}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#243c2a,#0b100e 65%)}.authcard{width:min(100%,440px);padding:30px;border:1px solid #475344;border-radius:20px;background:#141d17;box-shadow:0 20px 70px #0008}.logo{display:inline-grid;place-items:center;width:54px;height:54px;border:2px solid var(--gold);border-radius:15px;color:var(--gold);font-weight:900;font-size:20px}.tabs{display:flex;gap:6px;margin:18px 0}.tabs button{flex:1}.tabs .active{background:var(--gold);color:#111}.msg{min-height:20px;color:var(--gold);font-size:13px;margin-top:12px}.shell[hidden],.auth[hidden]{display:none!important}.shell{display:grid;grid-template-columns:215px minmax(0,1fr);min-height:100vh}aside{background:#101713;border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:15px}.brand{font-weight:900;color:var(--gold);font-size:17px;padding:10px 5px}nav{display:grid;gap:6px}nav button{text-align:left;background:transparent;border-color:transparent;color:#d1d8d0}nav button.active,nav button:hover{background:#2a352b;border-color:#475746;color:var(--gold)}.sidefoot{margin-top:auto}.main{padding:14px 22px 22px;min-width:0;max-width:1700px;width:100%;margin:0 auto;align-self:start}.topbar{margin-top:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.topbar h2{margin:0;font-size:25px}.chip{border:1px solid var(--line);border-radius:22px;padding:8px 12px;color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;min-width:0}.stat small{color:var(--muted)}.stat strong{display:block;font-size:23px;margin-top:8px;overflow-wrap:anywhere}.layout2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted)}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed #3b4a3e;border-radius:9px}.pos{display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(300px,1fr);gap:14px}.categories{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.categories button{font-size:12px;padding:8px 10px}.menuitems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.menuitem{min-height:68px;text-align:center;font-weight:800;background:var(--lime);color:#15220d;border:0}.menuitem:nth-child(5n+2){background:var(--cyan);color:#102222}.menuitem:nth-child(5n+3){background:var(--blue);color:#fff}.menuitem:nth-child(5n+4){background:#42cf82;color:#10281a}.menuitem:nth-child(5n){background:var(--pink);color:#321222}.cartrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:7px;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}.cartrow button{padding:5px 9px}.total{font-size:22px;color:var(--gold);font-weight:900}.actionbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actionbar button{flex:1}.hidden{display:none!important}.notice{padding:10px 12px;background:#26372a;border:1px solid #4b654d;border-radius:9px;margin-bottom:12px;color:#d9f1d5}.receipt{background:#fff;color:#17211b;padding:22px 18px;width:100%;max-width:360px;margin:0 auto;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.45;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 8px 24px #0001}.receipt .receipt-brand{text-align:center;border-bottom:1px dashed #9ca3af;padding-bottom:12px;margin-bottom:12px}.receipt .receipt-brand h2{font-size:20px;letter-spacing:.5px;margin:0 0 5px;color:#111827;overflow-wrap:anywhere}.receipt .receipt-brand p{margin:2px 0;color:#4b5563;overflow-wrap:anywhere}.receipt .receipt-meta{display:grid;gap:4px;margin:10px 0}.receipt .receipt-meta div{display:flex;justify-content:space-between;gap:12px}.receipt .receipt-meta span:first-child{color:#6b7280}.receipt .receipt-items{width:100%;border-collapse:collapse;margin:10px 0}.receipt .receipt-items th{font-size:10px;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #d1d5db;padding:6px 2px}.receipt .receipt-items td{padding:8px 2px;border-bottom:1px dashed #e5e7eb;white-space:normal}.receipt .receipt-items th:last-child,.receipt .receipt-items td:last-child{text-align:right}.receipt .receipt-totals{border-top:1px dashed #9ca3af;padding-top:9px;margin-top:8px}.receipt .receipt-totals div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.receipt .receipt-totals .grand{font-size:17px;font-weight:800;color:#111827;border-top:1px solid #d1d5db;margin-top:5px;padding-top:9px}.receipt .receipt-thanks{text-align:center;border-top:1px dashed #9ca3af;margin-top:14px;padding-top:12px;color:#374151}.receipt .receipt-print{display:block;margin:12px auto 0;background:#e5e7eb;color:#111827;border:1px solid #d1d5db}.receipt .receipt-print{display:none}@media(max-width:900px){.shell{grid-template-columns:1fr}aside{padding:10px}.sidefoot{margin-top:0}nav{display:flex;overflow:auto}nav button{white-space:nowrap}.main{padding:13px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.pos,.layout2{grid-template-columns:1fr}}@media(max-width:480px){.formgrid{grid-template-columns:1fr}.menuitems{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{align-items:flex-start;flex-direction:column}.stat strong{font-size:19px}}

<body>
<section id="auth" class="auth"><div class="authcard"><div class="logo">WΩ</div><p class="gold" style="margin-top:16px;letter-spacing:2px;font-size:11px">SALES · INVENTORY · RESTAURANT · BUSINESS</p><h1>WIZO <span class="gold">OMEGA POS</span></h1><p class="muted">Manage your business from one place.</p><div class="tabs"><button id="signinTab" class="active" type="button">Sign in</button><button id="signupTab" type="button">Create account</button></div><form id="authForm"><div id="businessField" class="hidden"><label>Business / Restaurant name</label><input id="businessName" autocomplete="organization" placeholder="Your business name"></div><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters"><button id="authSubmit" class="primary" style="width:100%;margin-top:16px" type="submit">Sign in</button><div id="authMsg" class="msg"></div></form></div></section>
<div id="shell" class="shell" hidden><aside><div class="brand">WΩ WIZO OMEGA</div><nav id="nav"><button data-page="Dashboard" class="active">▦ Dashboard</button><button data-page="POS">▣ POS / New Sale</button><button data-page="Products">◫ Products & Stock</button><button data-page="Purchases">⇩ Purchases</button><button data-page="Expenses">↗ Expenses</button><button data-page="Customers">♙ Customers</button><button data-page="Suppliers">♧ Suppliers</button><button data-page="Sales">▤ Sales History</button><button data-page="Reports">▥ Reports</button><button data-page="Cashier Management">♙ Cashier Management</button><button data-page="Budget">▤ Budget</button><button data-page="Settings">⚙ Settings</button></nav><div class="sidefoot"><button id="logout" style="width:100%">Sign out</button></div></aside><main class="main"><div class="topbar"><div><p class="gold" style="font-size:10px;letter-spacing:2px;margin-bottom:4px">BUSINESS MANAGEMENT</p><h2 id="pageTitle">Dashboard</h2></div><span id="businessChip" class="chip">My Business</span></div><div id="appNotice"></div><section id="content"></section></main></div>
<div id="printArea" class="hidden"></div>
<script>
const SUPABASE_URL="https://hgwotfexwdctqjprkbst.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_4SgxZyVh3qSwdFwpPf03CQ_yfF0W95e";
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);let authMode="signin",currentUser=null,business=null,currentRole="owner",products=[],cart=[],pageNow="Dashboard",profile={name:"",phone:"",address:"",logo_url:"",currency:"ETB"};
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:profile.currency||"ETB"}).format(Number(n||0));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function say(id,msg){if($(id))$(id).textContent=msg}
function setAuthMode(m){authMode=m;$("signinTab").classList.toggle("active",m==="signin");$("signupTab").classList.toggle("active",m==="signup");$("businessField").classList.toggle("hidden",m!=="signup");$("businessName").required=m==="signup";$("authSubmit").textContent=m==="signin"?"Sign in":"Create account";say("authMsg",m==="signup"?"Enter your business name, email and password.":"")}
$("signinTab").onclick=()=>setAuthMode("signin");$("signupTab").onclick=()=>setAuthMode("signup");
$("authForm").onsubmit=async e=>{e.preventDefault();if(!db){say("authMsg","Supabase library did not load. Check your internet connection.");return}const btn=$("authSubmit");btn.disabled=true;say("authMsg","Please wait…");try{const email=$("email").value.trim(),password=$("password").value;if(authMode==="signin"){const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await boot()}else{const name=$("businessName").value.trim();if(!name)throw Error("Enter your business name.");const {data,error}=await db.auth.signUp({email,password,options:{data:{business_name:name},emailRedirectTo:location.href.split("#")[0]}});if(error)throw error;if(!data.session){say("authMsg","Account created. Check your email confirmation, then sign in. Business profile will be created automatically after confirmation.");return}await boot()}}catch(err){say("authMsg",err.message||"Could not sign in/create account.")}finally{btn.disabled=false}};
$("logout").onclick=async()=>{await db.auth.signOut();currentUser=null;business=null;currentRole="owner";products=[];cart=[];$("shell").hidden=true;$("auth").hidden=false;setAuthMode("signin")};
$("nav").onclick=e=>{const b=e.target.closest("[data-page]");if(b)showPage(b.dataset.page)};
async function boot(){const {data:{user},error}=await db.auth.getUser();if(error)throw error;if(!user)return;currentUser=user;$("auth").hidden=true;$("shell").hidden=false;await loadBusiness();await showPage("Dashboard")}
async function loadBusiness(){
  const {data:membership,error:memberError}=await db.from("business_members")
    .select("business_id,role").eq("user_id",currentUser.id).limit(1).maybeSingle();
  if(memberError)throw memberError;
  if(!membership)throw Error("Your account is not linked to a business. Ask the business owner to add your account.");
  currentRole=String(membership.role||"cashier").toLowerCase();
  const {data,error}=await db.from("businesses").select("*").eq("id",membership.business_id).maybeSingle();
  if(error)throw error;
  if(!data)throw Error("Business profile not found for your account.");
  business=data;profile={...profile,...data};
  $("businessChip").textContent=(data.name||currentUser.email)+" · "+currentRole.toUpperCase();
  applyRoleAccess();
}
function isOwnerRole(){return ["owner","admin"].includes(currentRole)}
function applyRoleAccess(){
  const allowed=isOwnerRole()?["Dashboard","POS","Products","Purchases","Expenses","Customers","Suppliers","Sales","Reports","Cashier Management","Budget","Settings"]:["POS","Sales"];
  document.querySelectorAll("#nav button[data-page]").forEach(b=>{
    const ok=allowed.includes(b.dataset.page);
    b.hidden=!ok;
    b.disabled=!ok;
  });
  if(!allowed.includes(pageNow))pageNow="POS";
}
function showNotice(msg){$("appNotice").innerHTML=msg?`<div class="notice">${esc(msg)}</div>`:""}
async function showPage(p){
  const cashierAllowed=["POS","Sales"];
  if(!isOwnerRole()&&!cashierAllowed.includes(p)){showNotice("This page is available to Owner/Admin only.");p="POS";}
  pageNow=p;$("pageTitle").textContent=p;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
  showNotice("");
  try{if(p==="Dashboard")await dashboard();else if(p==="POS")await renderPOS();else if(p==="Products")await productsPage();else if(p==="Purchases")await purchasesPage();else if(p==="Expenses")await expensesPage();else if(p==="Customers")await simpleDirectory("Customers");else if(p==="Suppliers")await simpleDirectory("Suppliers");else if(p==="Sales")await salesPage();else if(p==="Reports")await reportsPage();else if(p==="Cashier Management")await cashierManagementPage();else if(p==="Budget")await budgetPage();else if(p==="Settings")settingsPage()}
  catch(err){showNotice(err.message||String(err));$("content").innerHTML=`<div class="panel"><h3>Unable to load this page</h3><p>${esc(err.message||String(err))}</p></div>`}
}
async function q(table,select="*"){const {data,error}=await db.from(table).select(select).order("created_at",{ascending:false});if(error)throw error;return data||[]}
async function dashboard(){const [sales,expenses,prods,purchases]=await Promise.all([q("sales"),q("expenses"),q("products"),q("purchases")]);const totalSales=sales.filter(s=>s.status==="completed").reduce((a,s)=>a+Number(s.total),0),purchaseCost=purchases.reduce((a,s)=>a+Number(s.total_cost),0),expenseCost=expenses.reduce((a,s)=>a+Number(s.amount),0),profit=sales.filter(s=>s.status==="completed").reduce((a,s)=>a+Number(s.total)-Number(s.cost_total||0),0)-expenseCost; $("content").innerHTML=`<div class="stats"><div class="stat"><small>TOTAL SALES</small><strong>${money(totalSales)}</strong></div><div class="stat"><small>PURCHASE COST</small><strong>${money(purchaseCost)}</strong></div><div class="stat"><small>EST. NET PROFIT</small><strong>${money(profit)}</strong></div><div class="stat"><small>STOCK PRODUCTS</small><strong>${prods.length}</strong></div></div><div class="layout2"><div class="panel"><h3>Recent sales</h3>${tableHTML(sales.slice(0,6),["invoice_number","total","payment_method","created_at"])}</div><div class="panel"><h3>Quick actions</h3><div class="row"><button class="primary" data-goto="POS">＋ New sale</button><button data-goto="Products">＋ Add product</button></div><p class="muted" style="margin-top:14px">Inventory items: ${prods.length} · Expenses: ${expenses.length}</p></div></div>`;bindGoto()}
function tableHTML(rows,cols){if(!rows.length)return '<div class="empty">No records yet.</div>';return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c.replaceAll("_"," "))}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c==="total"||c==="amount"||c==="total_cost"?money(r[c]):c==="created_at"?new Date(r[c]).toLocaleString():r[c]??"—")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function bindGoto(){$$(" [data-goto]".trim()).forEach(b=>b.onclick=()=>showPage(b.dataset.goto))}
function $$(s){return document.querySelectorAll(s)}
async function getProducts(){
  const fields=isOwnerRole()
    ?"id,business_id,name,sku,unit,stock_quantity,cost_price,selling_price,low_stock_threshold,created_at,updated_at,category"
    :"id,business_id,name,sku,unit,stock_quantity,selling_price,low_stock_threshold,created_at,updated_at,category";
  const {data,error}=await db.from("products").select(fields).eq("business_id",business.id).order("created_at",{ascending:false});
  if(error)throw error;products=data||[];return products;
}
async function productsPage(){await getProducts();$("content").innerHTML=`<div class="panel"><h3>Add product / stock item</h3><form id="productForm"><div class="formgrid"><div><label>Product name *</label><input name="name" required></div><div><label>Barcode / SKU</label><input name="sku"></div><div><label>Category</label><input name="category" placeholder="Food, drink, grocery..."></div><div><label>Unit</label><select name="unit"><option>piece</option><option>kg</option><option>gram</option><option>liter</option><option>box</option><option>carton</option><option>plate</option><option>portion</option></select></div><div><label>Opening stock</label><input name="stock_quantity" type="number" min="0" step=".001" value="0" required></div><div><label>Purchase cost</label><input name="cost_price" type="number" min="0" step=".01" value="0" required></div><div><label>Selling price</label><input name="selling_price" type="number" min="0" step=".01" value="0" required></div><div><label>Low-stock alert level</label><input name="low_stock_threshold" type="number" min="0" step=".001" value="0"></div></div><button class="primary" style="margin-top:15px">Save product</button><span id="productMsg" class="msg"></span></form></div><div class="panel"><h3>Inventory (${products.length})</h3>${tableHTML(products,["name","sku","category","stock_quantity","unit","cost_price","selling_price"])}<div id="lowStock" class="muted"></div></div>`;$("productForm").onsubmit=saveProduct;const low=products.filter(p=>Number(p.stock_quantity)<=Number(p.low_stock_threshold)&&Number(p.low_stock_threshold)>0);$("lowStock").textContent=low.length?"Low stock: "+low.map(p=>p.name).join(", "):""}
async function saveProduct(e){e.preventDefault();const f=new FormData(e.currentTarget);const row={business_id:business.id,name:String(f.get("name")).trim(),sku:String(f.get("sku")||"").trim()||null,category:String(f.get("category")||"").trim()||null,unit:f.get("unit"),stock_quantity:Number(f.get("stock_quantity")),cost_price:Number(f.get("cost_price")),selling_price:Number(f.get("selling_price")),low_stock_threshold:Number(f.get("low_stock_threshold")||0)};try{const {error}=await db.from("products").insert(row);if(error)throw error;showNotice("Product saved.");await productsPage()}catch(err){say("productMsg",err.message)}}
async function renderPOS(){await getProducts();cart=[];$("content").innerHTML=`<div class="pos"><div class="panel"><div class="row"><div><label>Search menu / barcode</label><input id="menuSearch" placeholder="Type product name or SKU"></div><div><label>Category</label><select id="categoryFilter"><option value="">All categories</option>${[...new Set(products.map(p=>p.category).filter(Boolean))].map(c=>`<option>${esc(c)}</option>`).join("")}</select></div></div><div id="menuGrid" class="menuitems" style="margin-top:12px"></div><p class="muted" style="margin-top:10px">Click a product to add it to the current order.</p></div><div class="panel"><h3>Current order</h3><div class="formgrid"><div><label>Table / order no.</label><input id="tableNo" placeholder="Takeaway / Table 1"></div><div><label>Customer</label><input id="saleCustomer" placeholder="Optional customer name"></div><div><label>Payment</label><select id="payment"><option value="cash">Cash</option><option value="card">Card</option><option value="transfer">Transfer</option><option value="credit">Credit</option></select></div><div><label>Discount</label><input id="discount" type="number" min="0" step=".01" value="0"></div></div><div id="cartItems" style="margin-top:15px"></div><div class="row" style="margin-top:15px"><span class="muted">Subtotal</span><b id="subtotal">${money(0)}</b></div><div class="row"><span class="muted">Total</span><strong class="total" id="cartTotal">${money(0)}</strong></div><div class="actionbar"><button id="clearCart">Clear</button><button id="payBtn" class="primary">💳 Pay & save sale</button></div><p class="muted" id="saleMsg" style="margin-top:10px"></p></div></div>`;const paintMenu=()=>{const term=$("menuSearch").value.toLowerCase(),cat=$("categoryFilter").value;const list=products.filter(p=>(!cat||p.category===cat)&&(!term||p.name.toLowerCase().includes(term)||(p.sku||"").toLowerCase().includes(term)));$("menuGrid").innerHTML=list.map(p=>`<button class="menuitem" data-add="${p.id}">${esc(p.name)}<br><small>${money(p.selling_price)}</small></button>`).join("")||'<div class="empty">No matching products. Add products first.</div>';$$("[data-add]").forEach(b=>b.onclick=()=>addToCart(b.dataset.add))};$("menuSearch").oninput=paintMenu;$("categoryFilter").onchange=paintMenu;paintMenu();$("clearCart").onclick=()=>{cart=[];paintCart()};$("discount").oninput=paintCart;$("payBtn").onclick=checkout;paintCart()}
function addToCart(id){const p=products.find(x=>x.id===id);if(!p)return;const existing=cart.find(x=>x.product_id===id);if(existing)existing.quantity+=1;else cart.push({product_id:p.id,product_name:p.name,unit:p.unit,quantity:1,unit_price:Number(p.selling_price),cost_price:Number(p.cost_price),stock_quantity:Number(p.stock_quantity)});paintCart()}
function paintCart(){if(!$("cartItems"))return;$("cartItems").innerHTML=cart.map((x,i)=>`<div class="cartrow"><div>${esc(x.product_name)}<br><small class="muted">${money(x.unit_price)} / ${esc(x.unit)}</small></div><button data-dec="${i}">−</button><b>${x.quantity}</b><button data-inc="${i}">+</button><button class="danger" data-remove="${i}">×</button></div>`).join("")||'<div class="empty">Order is empty.</div>';$$("[data-inc]").forEach(b=>b.onclick=()=>{cart[+b.dataset.inc].quantity+=1;paintCart()});$$("[data-dec]").forEach(b=>b.onclick=()=>{const i=+b.dataset.dec;cart[i].quantity-=1;if(cart[i].quantity<=0)cart.splice(i,1);paintCart()});$$("[data-remove]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);paintCart()});const sub=cart.reduce((a,x)=>a+x.quantity*x.unit_price,0),disc=Math.max(0,Number($("discount")?.value||0));$("subtotal").textContent=money(sub);$("cartTotal").textContent=money(Math.max(0,sub-disc))}
async function checkout(){if(!cart.length){say("saleMsg","Add at least one item.");return}const btn=$("payBtn");btn.disabled=true;say("saleMsg","Saving sale…");try{const discount=Math.max(0,Number($("discount").value||0));const payload={p_business_id:business.id,p_invoice_number:"INV-"+Date.now(),p_payment_method:$("payment").value,p_discount:discount,p_customer_name:$("saleCustomer").value.trim()||null,p_table_label:$("tableNo").value.trim()||null,p_items:cart.map(x=>({product_id:x.product_id,quantity:x.quantity}))};const {data,error}=await db.rpc("wizo_checkout",payload);if(error)throw error;const sale=Array.isArray(data)?data[0]:data;const items=cart.map(x=>({...x}));cart=[];say("saleMsg","Sale saved. Invoice: "+(sale?.invoice_number||payload.p_invoice_number));showReceipt(sale||{invoice_number:payload.p_invoice_number,total:items.reduce((a,x)=>a+x.quantity*x.unit_price,0)-discount},items);await loadBusiness();await renderPOS()}catch(err){say("saleMsg",err.message||"Sale failed")}finally{if($("payBtn"))$("payBtn").disabled=false}}
function showReceipt(sale,items){const el=$("printArea");const subtotal=items.reduce((sum,x)=>sum+(Number(x.quantity)||0)*(Number(x.unit_price)||0),0);const total=Number(sale.total??(subtotal-Math.max(0,Number($("discount")?.value||0))));const discount=Math.max(0,subtotal-total);const payment=$("payment")?.value||sale.payment_method||"Cash";const createdAt=new Date();el.className="receipt";el.innerHTML=`<div class="receipt-brand"><h2>${esc(profile.name||"WIZO OMEGA POS")}</h2>${profile.address?`<p>${esc(profile.address)}</p>`:""}${profile.phone?`<p>Tel: ${esc(profile.phone)}</p>`:""}<p>SALES RECEIPT</p></div><div class="receipt-meta"><div><span>Invoice</span><strong>${esc(sale.invoice_number||"")}</strong></div><div><span>Date</span><strong>${createdAt.toLocaleDateString()}</strong></div><div><span>Time</span><strong>${createdAt.toLocaleTimeString()}</strong></div>${$("saleCustomer")?.value.trim()?`<div><span>Customer</span><strong>${esc($("saleCustomer").value.trim())}</strong></div>`:""}${$("tableNo")?.value.trim()?`<div><span>Table / Order</span><strong>${esc($("tableNo").value.trim())}</strong></div>`:""}<div><span>Payment</span><strong>${esc(payment)}</strong></div></div><table class="receipt-items"><thead><tr><th>Item</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.product_name||"Item")}<br><small>${money(x.unit_price)} each</small></td><td>${Number(x.quantity)||0}</td><td>${money((Number(x.quantity)||0)*(Number(x.unit_price)||0))}</td></tr>`).join("")}</tbody></table><div class="receipt-totals"><div><span>Subtotal</span><strong>${money(subtotal)}</strong></div>${discount>0?`<div><span>Discount</span><strong>− ${money(discount)}</strong></div>`:""}<div class="grand"><span>TOTAL</span><strong>${money(total)}</strong></div></div><div class="receipt-thanks"><strong>Thank you for your visit!</strong><p style="margin:4px 0 0">We hope to see you again.</p></div><button class="receipt-print" onclick="window.print()">Print receipt</button>`;setTimeout(()=>{const w=window.open("","_blank","width=420,height=700");if(w){w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Receipt ${esc(sale.invoice_number||"")}</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#fff;color:#17211b;font:12px/1.45 Arial,Helvetica,sans-serif}.receipt{width:100%;max-width:360px;margin:0 auto;padding:18px}.receipt-brand{text-align:center;border-bottom:1px dashed #9ca3af;padding-bottom:12px;margin-bottom:12px}.receipt-brand h2{font-size:20px;margin:0 0 5px;overflow-wrap:anywhere}.receipt-brand p{margin:2px 0;color:#4b5563}.receipt-meta{display:grid;gap:4px;margin:10px 0}.receipt-meta div{display:flex;justify-content:space-between;gap:12px}.receipt-meta span:first-child{color:#6b7280}.receipt-items{width:100%;border-collapse:collapse;margin:10px 0}.receipt-items th{font-size:10px;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #d1d5db;padding:6px 2px}.receipt-items td{padding:8px 2px;border-bottom:1px dashed #e5e7eb;white-space:normal}.receipt-items th:last-child,.receipt-items td:last-child{text-align:right}.receipt-totals{border-top:1px dashed #9ca3af;padding-top:9px;margin-top:8px}.receipt-totals div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.receipt-totals .grand{font-size:17px;font-weight:800;border-top:1px solid #d1d5db;margin-top:5px;padding-top:9px}.receipt-thanks{text-align:center;border-top:1px dashed #9ca3af;margin-top:14px;padding-top:12px;color:#374151}small{color:#6b7280}@page{size:80mm auto;margin:4mm}@media print{body{padding:0}.receipt{max-width:none;padding:0}}</style></head><body>${el.innerHTML}</body></html>`);w.document.close();w.focus();setTimeout(()=>{w.print()},250)}},100)}
async function purchasesPage(){const [ps,prods,sups]=await Promise.all([q("purchases"),getProducts(),q("suppliers")]);$("content").innerHTML=`<div class="panel"><h3>Record purchase / stock received</h3><form id="purchaseForm"><div class="formgrid"><div><label>Product *</label><select name="product_id" required>${prods.map(p=>`<option value="${p.id}">${esc(p.name)} (stock ${p.stock_quantity})</option>`).join("")}</select></div><div><label>Supplier</label><select name="supplier_id"><option value="">None</option>${sups.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div><div><label>Quantity</label><input name="quantity" type="number" min=".001" step=".001" required></div><div><label>Unit cost</label><input name="unit_cost" type="number" min="0" step=".01" required></div><div><label>Transport cost</label><input name="transport_cost" type="number" min="0" step=".01" value="0"></div><div><label>Loading / unloading</label><input name="loading_cost" type="number" min="0" step=".01" value="0"></div></div><button class="primary" style="margin-top:15px">Save purchase & update stock</button><span id="purchaseMsg" class="msg"></span></form></div><div class="panel"><h3>Purchase history</h3>${tableHTML(ps,["purchase_number","total_cost","created_at"])}</div>`;$("purchaseForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const {data,error}=await db.rpc("wizo_record_purchase",{p_business_id:business.id,p_product_id:f.get("product_id"),p_quantity:Number(f.get("quantity")),p_unit_cost:Number(f.get("unit_cost")),p_supplier_id:f.get("supplier_id")||null,p_transport_cost:Number(f.get("transport_cost")||0),p_loading_cost:Number(f.get("loading_cost")||0)});if(error)throw error;say("purchaseMsg","Purchase saved and stock updated.");await purchasesPage()}catch(err){say("purchaseMsg",err.message)}}}
async function expensesPage(){const es=await q("expenses");$("content").innerHTML=`<div class="panel"><h3>Add expense</h3><form id="expenseForm"><div class="formgrid"><div><label>Expense title</label><input name="title" required></div><div><label>Category</label><select name="category"><option>Rent</option><option>Salary</option><option>Transport</option><option>Utilities</option><option>Supplies</option><option>Other</option></select></div><div><label>Amount</label><input name="amount" type="number" min=".01" step=".01" required></div><div><label>Note</label><input name="note"></div></div><button class="primary" style="margin-top:14px">Save expense</button><span id="expenseMsg" class="msg"></span></form></div><div class="panel"><h3>Expenses</h3>${tableHTML(es,["title","category","amount","created_at"])}</div>`;$("expenseForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const {error}=await db.from("expenses").insert({business_id:business.id,title:f.get("title"),category:f.get("category"),amount:Number(f.get("amount")),note:f.get("note")||null});if(error)throw error;await expensesPage()}catch(err){say("expenseMsg",err.message)}}}
async function simpleDirectory(which){const isC=which==="Customers",table=isC?"customers":"suppliers",rows=await q(table);$("content").innerHTML=`<div class="panel"><h3>Add ${which.slice(0,-1).toLowerCase()}</h3><form id="dirForm"><div class="formgrid"><div><label>Name *</label><input name="name" required></div><div><label>Phone</label><input name="phone"></div><div><label>Email</label><input name="email" type="email"></div><div><label>Address</label><input name="address"></div></div><button class="primary" style="margin-top:14px">Save</button><span id="dirMsg" class="msg"></span></form></div><div class="panel"><h3>${which}</h3>${tableHTML(rows,["name","phone",...(isC?["email"]:["address"]),"created_at"])}</div>`;$("dirForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const row={business_id:business.id,name:f.get("name"),phone:f.get("phone")||null};if(isC)row.email=f.get("email")||null;else row.address=f.get("address")||null;try{const {error}=await db.from(table).insert(row);if(error)throw error;await simpleDirectory(which)}catch(err){say("dirMsg",err.message)}}}
async function salesPage(){
  let query=db.from("sales").select("invoice_number,table_label,total,payment_method,status,created_at,cashier_id").eq("business_id",business.id).order("created_at",{ascending:false});
  if(!isOwnerRole())query=query.eq("cashier_id",currentUser.id);
  const {data,error}=await query;if(error)throw error;
  $("content").innerHTML=`<div class="panel"><h3>Sales history</h3>${tableHTML(data||[],["invoice_number","table_label","total","payment_method","status","created_at"])}</div>`;
}
async function reportsPage(){const [sales,expenses,purchases,prods]=await Promise.all([q("sales"),q("expenses"),q("purchases"),q("products")]);const completed=sales.filter(s=>s.status==="completed");const total=completed.reduce((a,s)=>a+Number(s.total),0),cost=completed.reduce((a,s)=>a+Number(s.cost_total||0),0),exp=expenses.reduce((a,s)=>a+Number(s.amount),0);$("content").innerHTML=`<div class="stats"><div class="stat"><small>COMPLETED SALES</small><strong>${money(total)}</strong></div><div class="stat"><small>SALE COST</small><strong>${money(cost)}</strong></div><div class="stat"><small>GROSS PROFIT</small><strong>${money(total-cost)}</strong></div><div class="stat"><small>AFTER EXPENSES</small><strong>${money(total-cost-exp)}</strong></div></div><div class="layout2"><div class="panel"><h3>Purchases</h3><p class="total">${money(purchases.reduce((a,p)=>a+Number(p.total_cost),0))}</p></div><div class="panel"><h3>Inventory value (at cost)</h3><p class="total">${money(prods.reduce((a,p)=>a+Number(p.stock_quantity)*Number(p.cost_price),0))}</p></div></div><div class="panel"><h3>Sales records</h3>${tableHTML(sales,["invoice_number","total","status","created_at"])}</div>`}
async function cashierManagementPage(){
 if(!isOwnerRole())throw Error("Owner/Admin only.");
 const {data:members,error}=await db.from("business_members").select("user_id,role,created_at").eq("business_id",business.id).order("created_at",{ascending:true});
 if(error)throw error;
 const rows=members||[];
 $("content").innerHTML=`<div class="panel"><h3>Cashier Management</h3><p class="muted">Accounts already linked to this business are listed below. Creating a new login requires a secure invitation/authentication flow.</p><div class="tablewrap"><table><thead><tr><th>User ID</th><th>Role</th><th>Added</th></tr></thead><tbody>${rows.map(m=>`<tr><td>${esc(m.user_id)}</td><td><span class="chip">${esc(m.role||"cashier")}</span></td><td>${m.created_at?new Date(m.created_at).toLocaleDateString():"—"}</td></tr>`).join("")||`<tr><td colspan="3">No team members found.</td></tr>`}</tbody></table></div><p class="muted" style="margin-top:12px">For security, this page does not create accounts or change roles until the secure Supabase invitation/role function is configured.</p><button class="primary" id="refreshMembers">Refresh list</button></div>`;
 $("refreshMembers").onclick=()=>cashierManagementPage();
}
async function budgetPage(){
 if(!isOwnerRole())throw Error("Owner/Admin only.");
 const [sales,expenses,purchases]=await Promise.all([q("sales"),q("expenses"),q("purchases")]);
 const completed=sales.filter(x=>x.status==="completed");
 const revenue=completed.reduce((a,x)=>a+Number(x.total||0),0),expenseTotal=expenses.reduce((a,x)=>a+Number(x.amount||0),0),purchaseTotal=purchases.reduce((a,x)=>a+Number(x.total_cost||0),0);
 const key=`wizo_budget_${business.id}`,saved=localStorage.getItem(key)||"0";
 $("content").innerHTML=`<div class="stats"><div class="stat"><small>SALES REVENUE</small><strong>${money(revenue)}</strong></div><div class="stat"><small>EXPENSES</small><strong>${money(expenseTotal)}</strong></div><div class="stat"><small>PURCHASES</small><strong>${money(purchaseTotal)}</strong></div><div class="stat"><small>REMAINING AFTER EXPENSES & PURCHASES</small><strong>${money(revenue-expenseTotal-purchaseTotal)}</strong></div></div><div class="panel"><h3>Budget planning</h3><p class="muted">Set a sales target for this business. This target is saved in this browser only; it is not yet synchronized across devices.</p><form id="budgetForm"><label>Sales target (${esc(profile.currency||"ETB")})</label><input id="budgetTarget" type="number" min="0" step="0.01" value="${esc(saved)}" required><button class="primary" style="margin-top:12px">Save budget target</button><span id="budgetMsg" class="msg"></span></form><div style="margin-top:18px"><p>Target progress</p><div style="height:12px;background:#253129;border-radius:8px;overflow:hidden"><div id="budgetBar" style="height:100%;width:0;background:var(--gold)"></div></div><p id="budgetProgress" class="muted" style="margin-top:8px"></p></div></div>`;
 const target=Number(saved)||0,percent=target>0?Math.min(100,revenue/target*100):0;
 $("budgetBar").style.width=percent+"%";$("budgetProgress").textContent=target>0?`${percent.toFixed(1)}% of target reached (${money(Math.max(0,target-revenue))} remaining)`:"Set a target to see progress.";
 $("budgetForm").onsubmit=e=>{e.preventDefault();const val=Number($("budgetTarget").value);localStorage.setItem(key,String(val));say("budgetMsg","Budget target saved in this browser.");const pct=val>0?Math.min(100,revenue/val*100):0;$("budgetBar").style.width=pct+"%";$("budgetProgress").textContent=val>0?`${pct.toFixed(1)}% of target reached (${money(Math.max(0,val-revenue))} remaining)`:"Set a target to see progress."};
}
function settingsPage(){$("content").innerHTML=`<div class="panel"><h3>Business / receipt settings</h3><form id="settingsForm"><div class="formgrid"><div><label>Business name</label><input name="name" required value="${esc(profile.name||"")}"></div><div><label>Phone</label><input name="phone" value="${esc(profile.phone||"")}"></div><div><label>Address</label><input name="address" value="${esc(profile.address||"")}"></div><div><label>Currency</label><select name="currency"><option ${profile.currency==="ETB"?"selected":""}>ETB</option><option ${profile.currency==="SAR"?"selected":""}>SAR</option><option ${profile.currency==="USD"?"selected":""}>USD</option></select></div><div style="grid-column:1/-1"><label>Logo image URL (optional)</label><input name="logo_url" value="${esc(profile.logo_url||"")}"></div></div><button class="primary" style="margin-top:14px">Save settings</button><span id="settingsMsg" class="msg"></span></form><p class="muted">These details are used on receipts. The logo URL must be a publicly accessible image URL.</p></div>`;$("settingsForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const {error}=await db.from("businesses").update({name:f.get("name"),phone:f.get("phone")||null,address:f.get("address")||null,currency:f.get("currency"),logo_url:f.get("logo_url")||null}).eq("id",business.id);if(error)throw error;await loadBusiness();say("settingsMsg","Settings saved.")}catch(err){say("settingsMsg",err.message)}}}
(async()=>{if(!db){say("authMsg","Supabase library failed to load. Check internet.");return}const {data:{session}}=await db.auth.getSession();if(session){try{await boot()}catch(err){$("auth").hidden=false;$("shell").hidden=true;say("authMsg",err.message)}}})();
</script>
