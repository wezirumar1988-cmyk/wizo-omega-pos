#10281a}.menuitem:nth-child(5n){background:var(--pink);color:#321222}.cartrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:7px;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}.cartrow button{padding:5px 9px}.total{font-size:22px;color:var(--gold);font-weight:900}.actionbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actionbar button{flex:1}.hidden{display:none!important}.notice{padding:10px 12px;background:#26372a;border:1px solid #4b654d;border-radius:9px;margin-bottom:12px;color:#d9f1d5}.receipt{background:#fff;color:#17211b;padding:22px 18px;width:100%;max-width:360px;margin:0 auto;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.45;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 8px 24px #0001}.receipt .receipt-brand{text-align:center;border-bottom:1px dashed #9ca3af;padding-bottom:12px;margin-bottom:12px}.receipt .receipt-brand h2{font-size:20px;letter-spacing:.5px;margin:0 0 5px;color:#111827;overflow-wrap:anywhere}.receipt .receipt-brand p{margin:2px 0;color:#4b5563;overflow-wrap:anywhere}.receipt .receipt-meta{display:grid;gap:4px;margin:10px 0}.receipt .receipt-meta div{display:flex;justify-content:space-between;gap:12px}.receipt .receipt-meta span:first-child{color:#6b7280}.receipt .receipt-items{width:100%;border-collapse:collapse;margin:10px 0}.receipt .receipt-items th{font-size:10px;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #d1d5db;padding:6px 2px}.receipt .receipt-items td{padding:8px 2px;border-bottom:1px dashed #e5e7eb;white-space:normal}.receipt .receipt-items th:last-child,.receipt .receipt-items td:last-child{text-align:right}.receipt .receipt-totals{border-top:1px dashed #9ca3af;padding-top:9px;margin-top:8px}.receipt .receipt-totals div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.receipt .receipt-totals .grand{font-size:17px;font-weight:800;color:#111827;border-top:1px solid #d1d5db;margin-top:5px;padding-top:9px}.receipt <section id="auth" class="auth"><div class="authcard"><div class="logo">WΩ</div><p class="gold" style="margin-top:16px;letter-spacing:2px;font-size:11px">SALES · RESTAURANT · BUSINESS</p><h1>WIZO <span class="gold">OMEGA POS</span></h1><p class="muted">Manage your business from one place.</p><div class="tabs"><button id="signinTab" class="active" type="button">Sign in</button><button id="signupTab" type="button">Create account</button></div><form id="authForm"><div id="businessField" class="hidden"><label>Business / Restaurant name</label><input id="businessName" autocomplete="organization" placeholder="Your business name"></div><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters"><button id="authSubmit" class="primary" style="width:100%;margin-top:16px" type="submit">Sign in</button><div id="authMsg" class="msg"></div></form></div></section>
<div id="shell" class="shell" hidden><aside><div class="brand">WΩ WIZO OMEGA</div><nav id="nav"><button data-page="Dashboard" class="active">▦ Dashboard</button><button data-page="POS">▣ POS / New Sale</button><button data-page="Products">◫ Menu</button><button data-page="Purchases">⇩ Purchases</button><button data-page="Expenses">↗ Expenses</button><button data-page="Customers">♙ Customers</button><button data-page="Suppliers">♧ Suppliers</button><button data-page="Sales">▤ Sales History</button><button data-page="Reports">▥ Reports</button><button data-page="End of Day">▣ End of Day</button><button data-page="Cashier Management">♙ Cashier Management</button><button data-page="Employees">♧ Employees</button><button data-page="Budget">▤ Budget</button><button data-page="Settings">⚙ Settings</button></nav></aside><main class="main"><div class="topbar"><div><p class="gold" style="font-size:10px;letter-spacing:2px;margin-bottom:4px">BUSINESS MANAGEMENT</p><h2 id="pageTitle">Dashboard</h2></div><div class="topbar-actions"><span id="businessChip" class="chip">My Business</span><button id="logout" class="top-logout" type="button">↪ Sign out</button></div></div><div id="appNotice"></div><section id="content"></section></main></div>

<script>
const SUPABASE_URL="https://hgwotfexwdctqjprkbst.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_4SgxZyVh3qSwdFwpPf03CQ_yfF0W95e";
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);let authMode="signin",currentUser=null,business=null,currentRole="owner",products=[],cart=[],pageNow="Dashboard",profile={name:"",phone:"",address:"",logo_url:"",currency:"ETB"};
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:profile.currency||"ETB"}).format(Number(n||0));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function say(id,msg){if($(id))$(id).textContent=msg}
function setAuthMode(m){authMode=m;$("signinTab").classList.toggle("active",m==="signin");$("signupTab").classList.toggle("active",m==="signup");$("businessField").classList.toggle("hidden",m!=="signup");$("businessName").required=m==="signup";$("authSubmit").textContent=m==="signin"?"Sign in":"Create account";say("authMsg",m==="signup"?"Enter your business name, email and password.":"")}
$("signinTab").onclick=()=>setAuthMode("signin");$("signupTab").onclick=()=>setAuthMode("signup");
$("authForm").onsubmit=async e=>{e.preventDefault();if(!db){say("authMsg","Supabase library did not load. Check your internet connection.");return}const btn=$("authSubmit");btn.disabled=true;say("authMsg","Please wait…");try{const email=$("email").value.trim(),password=$("password").value;if(authMode==="signin"){const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await boot()}else{const name=$("businessName").value.trim();if(!name)throw Error("Enter your business name.");const {data,error}=await db.auth.signUp({email,password,options:{data:{business_name:name},emailRedirectTo:location.href.split("#")[0]}});if(error)throw error;if(!data.session){say("authMsg","Account created. Check your email confirmation, then sign in. Business profile will be created automatically after confirmation.");return}await boot()}}catch(err){say("authMsg",err.message||"Could not sign in/create account.")}finally{btn.disabled=false}};
$("logout").onclick=async()=>{await db.auth.signOut();currentUser=null;business=null;currentRole="owner";products=[];cart=[];$("shell").hidden=true;$("auth").hidden=false;setAuthMode("signin")};
$("nav").onclick=e=>{const b=e.target.closest("[data-page]");if(b)showPage(b.dataset.page)};
async function boot(){const {data:{user},error}=await db.auth.getUser();if(error)throw error;if(!user)return;currentUser=user;$("auth").hidden=true;$("shell").hidden=false;await loadBusiness();await showPage("Dashboard")}
async function loadBusiness(){
  // A user can have memberships in more than one business. Do not use limit(1).
  // Prefer a cashier membership only when it is explicitly linked to this login email.
  // Otherwise prefer Owner/Admin so a cashier membership in another business cannot
  // accidentally select the wrong business and cause budget RLS failures.
  const loginEmail=String(currentUser.email||"").trim().toLowerCase();
  const {data:members,error:memberError}=await db.from("business_members")
    .select("business_id,role,email,full_name,is_active,created_at")
    .eq("user_id",currentUser.id)
    .eq("is_active",true)
    .order("created_at",{ascending:false});
  if(memberError)throw memberError;
  const activeMembers=(members||[]).filter(m=>m.is_active!==false);
  if(!activeMembers.length)throw Error("No active business membership was found for this account. Ask the business owner to check your access.");
  const emailCashier=activeMembers.find(m=>String(m.role||"").toLowerCase()==="cashier" && String(m.email||"").trim().toLowerCase()===loginEmail);
  const anyCashier=activeMembers.find(m=>String(m.role||"").toLowerCase()==="cashier");
  const ownerAdmin=activeMembers.find(m=>["owner","admin"].includes(String(m.role||"").toLowerCase()));
  const membership=emailCashier||ownerAdmin||anyCashier||activeMembers[0];
  currentRole=String(membership.role||"cashier").toLowerCase();
  const {data,error}=await db.from("businesses").select("*").eq("id",membership.business_id).maybeSingle();
  if(error)throw error;
  if(!data)throw Error("Business profile not found for your account.");
  business=data;profile={...profile,...data};
  $("businessChip").textContent=(data.name||currentUser.email)+" · "+currentRole.toUpperCase();
  applyRoleAccess();
}
function isOwnerRole(){return ["owner","admin"].includes(currentRole)}
function applyRoleAccess(){
  const allowed=isOwnerRole()?["Dashboard","POS","Products","Purchases","Expenses","Customers","Suppliers","Sales","Reports","Cashier Management","Employees","Budget","Settings"]:["Dashboard","POS","Sales","Reports","End of Day"];
  document.querySelectorAll("#nav button[data-page]").forEach(b=>{
    const ok=allowed.includes(b.dataset.page);
    b.hidden=!ok;
    b.disabled=!ok;
  });
  if(!allowed.includes(pageNow))pageNow="POS";
}
function showNotice(msg){$("appNotice").innerHTML=msg?`<div class="notice">${esc(msg)}</div>`:""}
async function showPage(p){
  const cashierAllowed=["Dashboard","POS","Sales","Reports","End of Day"];
  if(!isOwnerRole()&&!cashierAllowed.includes(p)){showNotice("This page is available to Owner/Admin only.");p="POS";}
  pageNow=p;$("pageTitle").textContent=p;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
  showNotice("");
  try{if(p==="Dashboard")await dashboard();else if(p==="POS")await renderPOS();else if(p==="Products")await productsPage();else if(p==="Purchases")await purchasesPage();else if(p==="Expenses")await expensesPage();else if(p==="Customers")await simpleDirectory("Customers");else if(p==="Suppliers")await simpleDirectory("Suppliers");else if(p==="Sales")await salesPage();else if(p==="Reports")await reportsPage();else if(p==="End of Day")await endOfDayPage();else if(p==="Cashier Management")await cashierManagementPage();else if(p==="Employees")await employeesPage();else if(p==="Budget")await budgetPage();else if(p==="Settings")settingsPage()}
  catch(err){showNotice(err.message||String(err));$("content").innerHTML=`<div class="panel"><h3>Unable to load this page</h3><p>${esc(err.message||String(err))}</p></div>`}
}
async function q(table,select="*"){const {data,error}=await db.from(table).select(select).order("created_at",{ascending:false});if(error)throw error;return data||[]}
async function dashboard(){if(!isOwnerRole()){const start=new Date();start.setHours(0,0,0,0);const end=new Date(start);end.setDate(end.getDate()+1);const {data,error}=await db.from("sales").select("id,total,status,created_at,cashier_id").eq("business_id",business.id).eq("cashier_id",currentUser.id).gte("created_at",start.toISOString()).lt("created_at",end.toISOString());if(error)throw error;const todays=(data||[]).filter(x=>x.status==="completed"),sum=todays.reduce((a,x)=>a+Number(x.total||0),0);$("content").innerHTML=`<div class="stats"><div class="stat"><small>TODAY'S SALES</small><strong>${money(sum)}</strong></div><div class="stat"><small>INVOICES TODAY</small><strong>${todays.length}</strong></div></div><div class="layout2"><div class="panel"><h3>Cashier workspace</h3><p class="muted">Use the buttons below to make sales and review your own transactions.</p><div class="row"><button class="primary" data-goto="POS">＋ New sale</button><button data-goto="Sales">Sales History</button></div></div><div class="panel"><h3>End of Day</h3><p class="muted">Review and print today's sales summary.</p><button class="primary" data-goto="End of Day">Open End of Day Report</button></div></div>`;bindGoto();return}const [sales,expenses,purchases]=await Promise.all([q("sales"),q("expenses"),q("purchases")]);const totalSales=sales.filter(s=>s.status==="completed").reduce((a,s)=>a+Number(s.total||0),0),directPurchaseCost=expenses.filter(e=>String(e.category||"").toLowerCase()==="direct purchase").reduce((a,e)=>a+Number(e.amount||0),0),purchaseCost=purchases.reduce((a,s)=>a+Number(s.total_cost||0),0)+directPurchaseCost,expenseCost=expenses.reduce((a,s)=>a+Number(s.amount||0),0),profit=sales.filter(s=>s.status==="completed").reduce((a,s)=>a+Number(s.total||0)-Number(s.cost_total||0),0);const {data:budgetRow,error:budgetError}=await db.from("wizo_budgets").select("amount").eq("business_id",business.id).maybeSingle();if(budgetError)throw budgetError;const budgetAmount=Math.max(0,Number(budgetRow?.amount||0)),nonPurchaseExpenses=Math.max(0,expenseCost-directPurchaseCost),budgetBalance=budgetAmount-purchaseCost-nonPurchaseExpenses;$("content").innerHTML=`<div class="stats"><div class="stat"><small>TOTAL SALES</small><strong>${money(totalSales)}</strong></div><div class="stat"><small>PURCHASE COST</small><strong>${money(purchaseCost)}</strong></div></div><div class="stats"><div class="stat"><small>BUDGET</small><strong>${money(budgetAmount)}</strong></div><div class="stat"><small>EXPENSES</small><strong>${money(expenseCost)}</strong></div><div class="stat"><small>BUDGET PURCHASES</small><strong>${money(purchaseCost)}</strong></div><div class="stat"><small>BUDGET BALANCE</small><strong style="color:${budgetBalance<0?'var(--red)':'var(--lime)'}">${money(budgetBalance)}</strong></div></div><div class="layout2"><div class="panel"><h3>Recent sales</h3>${tableHTML(sales.slice(0,6),["invoice_number","total","payment_method","created_at"])}</div><div class="panel"><h3>Quick actions</h3><div class="row"><button class="primary" data-goto="POS">＋ New sale</button><button data-goto="Products">＋ Edit Menu</button><button data-goto="Budget">▤ Set budget</button></div><p class="muted" style="margin-top:14px">Expenses: ${expenses.length}</p><p class="muted">Budget balance = Budget − Purchases − Expenses (excluding direct purchases already counted in Purchase Cost).</p></div></div>`;bindGoto()}
function tableHTML(rows,cols){if(!rows.length)return '<div class="empty">No records yet.</div>';return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c.replaceAll("_"," "))}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c==="total"||c==="amount"||c==="total_cost"?money(r[c]):c==="created_at"?new Date(r[c]).toLocaleString():r[c]??"—")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function bindGoto(){$$(" [data-goto]".trim()).forEach(b=>b.onclick=()=>showPage(b.dataset.goto))}
function $$(s){return document.querySelectorAll(s)}

  const fields=isOwnerRole()
    ?"id,business_id,name,sku,unit,stock_quantity,cost_price,selling_price,low_stock_threshold,created_at,updated_at,category"
    :"id,business_id,name,sku,unit,stock_quantity,selling_price,low_stock_threshold,created_at,updated_at,category";
  const {data,error}=await db.from("products").select(fields).eq("business_id",business.id).order("created_at",{ascending:false});

async function productsPage(){
  const key=`wizo_menu_items_${business.id}`;
  const readMenu=()=>{try{return JSON.parse(localStorage.getItem(key)||"[]")}catch{return []}};
  let editingId=null,pictureData="";
  const resetForm=()=>{editingId=null;pictureData="";$("menuItemForm").reset();$("menuPicturePreview").textContent="Choose an image to preview it.";$("menuFormTitle").textContent="＋ Add Menu Item";$("menuSaveBtn").textContent="Save menu item";$("menuCancelEdit").classList.add("hidden")};
  const renderMenu=()=>{
    const items=readMenu();
    $("menuItemsCount").textContent=`Menu items (${items.length})`;
    $("menuItemsList").innerHTML=items.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px">${items.map(item=>`<article class="panel" style="padding:12px"><div style="height:130px;border-radius:9px;overflow:hidden;background:var(--panel2);display:grid;place-items:center;margin-bottom:10px">${item.image?`<img src="${item.image}" alt="${esc(item.name)}" style="width:100%;height:100%;object-fit:cover">`:`<span class="muted">No picture</span>`}</div><h3 style="margin-bottom:5px">${esc(item.name)}</h3><p class="muted" style="margin-bottom:6px">${esc(item.category||"Other")}</p><strong class="gold">${money(item.price)}</strong>${item.description?`<p class="muted" style="margin-top:8px;margin-bottom:8px">${esc(item.description)}</p>`:""}<p style="margin:8px 0"><span class="chip">${item.available?"Available":"Unavailable"}</span></p><div class="row"><button type="button" data-edit-menu="${esc(item.id)}">Edit</button><button type="button" class="danger" data-delete-menu="${esc(item.id)}">Delete</button></div></article>`).join("")}</div>`:`<div class="empty">No menu items yet. Add your first restaurant item above.</div>`;
    $("menuItemsList").querySelectorAll("[data-edit-menu]").forEach(btn=>btn.onclick=()=>{
      const item=readMenu().find(x=>String(x.id)===btn.dataset.editMenu);if(!item)return;

  const editPanel=$("purchaseEditPanel"),editForm=$("purchaseEditForm");

      let supplierId=null;
      if(supplierName){const {data:found,error:findErr}=await db.from("suppliers").select("id,name").eq("business_id",business.id).ilike("name",supplierName).limit(1);if(findErr)throw findErr;if(found?.length)supplierId=found[0].id;else{const {data:created,error:createErr}=await db.from("suppliers").insert({business_id:business.id,name:supplierName}).select("id").single();if(createErr)throw createErr;supplierId=created.id}}

      }
    }catch(err){say("purchaseMsg",err.message)}
  }
}

 let balance=budgetAmount-purchaseTotal;
 const drawStats=()=>{balance=budgetAmount-purchaseTotal;const stats=$("content").querySelectorAll(".stats .stat strong");if(stats[0])stats[0].textContent=money(budgetAmount);if(stats[2]){stats[2].textContent=money(balance);stats[2].style.color=balance<0?"var(--red)":"var(--lime)"}const pct=budgetAmount>0?Math.min(100,purchaseTotal/budgetAmount*100):0;if($("budgetBar"))$("budgetBar").style.width=pct+"%";if($("budgetProgress"))$("budgetProgress").textContent=budgetAmount>0?`${pct.toFixed(1)}% of budget used · Balance: ${money(balance)}`:"Enter a budget amount to calculate the balance."};
 $("content").innerHTML=`<div class="stats"><div class="stat"><small>BUDGET</small><strong>${money(budgetAmount)}</strong></div><div class="stat"><small>PURCHASES</small><strong>${money(purchaseTotal)}</strong></div><div class="stat"><small>BALANCE (BUDGET − PURCHASES)</small><strong style="color:${balance<0?'var(--red)':'var(--lime)'}">${money(balance)}</strong></div><div class="stat"><small>SALES REVENUE</small><strong>${money(revenue)}</strong></div></div><div class="panel"><h3>Budget planning</h3><p class="muted">Budget and history are saved to Supabase Cloud for this business account, so they are available on other devices after sign-in.</p><form id="budgetForm"><div class="formgrid"><div><label>Budget name *</label><input id="budgetName" name="budget_name" maxlength="120" placeholder="e.g. Monthly stock budget" required></div><div><label>Budget amount to add (${esc(profile.currency||"ETB")}) *</label><input id="budgetTarget" name="amount" type="number" min="0.01" step="0.01" placeholder="Enter amount to add" required></div><div><label>Budget date *</label><input id="budgetDate" name="date" type="date" required value="${today()}"></div><div style="grid-column:1/-1"><label>Description / Notes</label><textarea id="budgetNotes" name="notes" maxlength="500" rows="2" placeholder="Optional details about this budget"></textarea></div></div><p class="muted">Current budget: <strong>${money(budgetAmount)}</strong>. The amount entered will be added to the current budget.</p><button class="primary" type="submit" style="margin-top:12px">＋ Add budget</button><span id="budgetMsg" class="msg"></span></form><div style="margin-top:18px"><p>Budget usage</p><div style="height:12px;background:#d1fae5;border-radius:8px;overflow:hidden"><div id="budgetBar" style="height:100%;width:0;background:var(--gold)"></div></div><p id="budgetProgress" class="muted" style="margin-top:8px"></p><button type="button" id="budgetDashboard" style="margin-top:8px">View Dashboard</button></div></div><div class="panel"><h3>Budget History</h3><p class="muted">History is saved in Supabase Cloud and follows this business account.</p><div id="budgetHistoryEditor" class="panel hidden" style="margin-bottom:14px;background:var(--panel2)"></div><div id="budgetHistory"></div></div>`;
 drawStats();
 const renderHistory=()=>{const el=$("budgetHistory");if(!history.length){el.innerHTML='<p class="muted">No budget changes recorded yet. Save a budget to start the history.</p>';return;}el.innerHTML=`<div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Budget name</th><th>Previous budget</th><th>Added amount</th><th>New total</th><th>Notes</th><th>Actions</th></tr></thead><tbody>${history.map(h=>`<tr><td>${esc(h.budget_date||new Date(h.created_at).toLocaleDateString())}</td><td>${esc(h.budget_name||"Budget")}</td><td>${money(h.previous_amount)}</td><td>+${money(Number(h.amount)-Number(h.previous_amount))}</td><td>${money(h.amount)}</td><td>${esc(h.notes||"—")}</td><td><div class="row"><button type="button" data-edit-cloud-budget="${esc(h.id)}">Edit</button><button type="button" class="danger" data-delete-cloud-budget="${esc(h.id)}">Delete</button></div></td></tr>`).join("")}</tbody></table></div>`;
 el.querySelectorAll("[data-edit-cloud-budget]").forEach(btn=>btn.onclick=()=>{const h=history.find(x=>String(x.id)===btn.dataset.editCloudBudget);if(!h)return;const editor=$("budgetHistoryEditor");editor.classList.remove("hidden");editor.innerHTML=`<h3>Edit budget history entry</h3><form id="cloudBudgetEditForm"><div class="formgrid"><div><label>Budget name</label><input name="name" maxlength="120" value="${esc(h.budget_name||"Budget")}" required></div><div><label>Previous budget</label><input name="previous" type="number" min="0" step=".01" value="${esc(h.previous_amount)}" required></div><div><label>New total</label><input name="amount" type="number" min="0" step=".01" value="${esc(h.amount)}" required></div><div><label>Date</label><input name="date" type="date" value="${esc(h.budget_date||String(h.created_at).slice(0,10))}" required></div><div style="grid-column:1/-1"><label>Notes</label><textarea name="notes" maxlength="500" rows="2">${esc(h.notes||"")}</textarea></div></div><button class="primary" type="submit">Save changes</button> <button type="button" id="cancelCloudBudgetEdit">Cancel</button><span id="cloudBudgetEditMsg" class="msg"></span></form>`;$("cancelCloudBudgetEdit").onclick=()=>editor.classList.add("hidden");$("cloudBudgetEditForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),previous=Number(f.get("previous")),amount=Number(f.get("amount"));if(previous<0||amount<0||!Number.isFinite(previous)||!Number.isFinite(amount)){say("cloudBudgetEditMsg","Enter valid non-negative amounts.");return;}const {error}=await db.from("wizo_budget_history").update({budget_name:String(f.get("name")||"Budget").trim(),previous_amount:previous,amount,budget_date:String(f.get("date")),notes:String(f.get("notes")||"").trim()}).eq("id",h.id).eq("business_id",business.id);if(error){say("cloudBudgetEditMsg",error.message);return;}history=history.map(x=>String(x.id)===String(h.id)?{...x,budget_name:String(f.get("name")||"Budget").trim(),previous_amount:previous,amount,budget_date:String(f.get("date")),notes:String(f.get("notes")||"").trim()}:x);if(history[0]&&String(history[0].id)===String(h.id)){budgetAmount=amount;const {error:be}=await db.from("wizo_budgets").upsert({business_id:business.id,amount,updated_by:currentUser.id},{onConflict:"business_id"});if(be){say("cloudBudgetEditMsg",be.message);return;}}editor.classList.add("hidden");drawStats();renderHistory();};editor.scrollIntoView({behavior:"smooth",block:"start"});});
 el.querySelectorAll("[data-delete-cloud-budget]").forEach(btn=>btn.onclick=async()=>{const i=history.findIndex(h=>String(h.id)===btn.dataset.deleteCloudBudget);if(i<0)return;const h=history[i];/* Treat an entry as the current budget change when its recorded total matches the current cloud budget. This is reliable even when multiple entries share the same date. */const affectsCurrent=Math.abs(Number(h.amount)-Number(budgetAmount))<0.005;if(!confirm(affectsCurrent?"Delete this budget history entry and restore the current budget to its previous amount?":"Delete this older history entry? Current budget will stay unchanged."))return;btn.disabled=true;const {error}=await db.from("wizo_budget_history").delete().eq("id",h.id).eq("business_id",business.id);if(error){btn.disabled=false;alert("Could not delete history: "+error.message);return;}history.splice(i,1);if(affectsCurrent){budgetAmount=Math.max(0,Number(h.previous_amount)||0);const {error:be}=await db.from("wizo_budgets").upsert({business_id:business.id,amount:budgetAmount,updated_by:currentUser.id},{onConflict:"business_id"});if(be){alert("History deleted, but current budget could not be updated: "+be.message);return;}}drawStats();renderHistory();say("budgetMsg",affectsCurrent?"Budget history deleted; current budget restored to previous amount.":"History entry deleted; current budget unchanged.");});};
 renderHistory();$("budgetDashboard").onclick=()=>showPage("Dashboard");
 $("budgetForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),added=Number(f.get("amount")),name=String(f.get("budget_name")||"").trim(),dateOnly=String(f.get("date")||""),notes=String(f.get("notes")||"").trim();if(!name||!dateOnly||!Number.isFinite(added)||added<=0){say("budgetMsg","Enter budget name, date, and an amount greater than zero.");return;}const previous=budgetAmount,total=previous+added;const btn=e.currentTarget.querySelector("button[type=submit]");btn.disabled=true;say("budgetMsg","Saving budget to cloud…");try{const {error:saveError}=await db.from("wizo_budgets").upsert({business_id:business.id,amount:total,updated_by:currentUser.id},{onConflict:"business_id"});if(saveError)throw saveError;const {data:newEntry,error:entryError}=await db.from("wizo_budget_history").insert({business_id:business.id,previous_amount:previous,amount:total,created_by:currentUser.id,budget_name:name,notes,budget_date:dateOnly,created_at:new Date(dateOnly+"T12:00:00").toISOString()}).select("id,business_id,previous_amount,amount,created_at,created_by,budget_name,notes,budget_date").single();if(entryError)throw entryError;budgetAmount=total;history.unshift(newEntry);history.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));history=history.slice(0,100);$("budgetForm").reset();$("budgetDate").value=today();say("budgetMsg","Budget saved to Supabase Cloud. Total budget: "+money(total));drawStats();renderHistory();}catch(err){say("budgetMsg","Could not save budget to cloud: "+(err.message||err));}finally{btn.disabled=false;}};
}

function settingsPage(){$("content").innerHTML=`<div class="panel"><h3>Business / receipt settings</h3><form id="settingsForm"><div class="formgrid"><div><label>Business name</label><input name="name" required value="${esc(profile.name||"")}"></div><div><label>Phone</label><input name="phone" value="${esc(profile.phone||"")}"></div><div><label>Address</label><input name="address" value="${esc(profile.address||"")}"></div><div><label>Currency</label><select name="currency"><option ${profile.currency==="ETB"?"selected":""}>ETB</option><option ${profile.currency==="SAR"?"selected":""}>SAR</option><option ${profile.currency==="USD"?"selected":""}>USD</option></select></div><div style="grid-column:1/-1"><label>Logo image URL (optional)</label><input name="logo_url" value="${esc(profile.logo_url||"")}"></div></div><button class="primary" style="margin-top:14px">Save settings</button><span id="settingsMsg" class="msg"></span></form><p class="muted">These details are used on receipts. The logo URL must be a publicly accessible image URL.</p></div>
<div class="panel"><h3>Backup & Restore Data</h3><p class="muted">Download a backup of this business data or restore from a WIZO OMEGA POS JSON backup file.</p><button type="button" class="primary" id="backupDataBtn">Download Backup</button> <label for="restoreDataFile" class="btn">Choose backup file</label><input id="restoreDataFile" type="file" accept=".json,application/json" style="display:none"><button type="button" id="restoreDataBtn">Restore Data</button><span id="dataToolsMsg" class="msg"></span></div>
<div class="panel"><h3>Delete Business Data</h3><p class="muted">This permanently deletes sales, purchases and purchase items, expenses, employees, products/menu items, customers, suppliers, and all cloud budget amounts/history for this business. Business name, business settings, and login account are kept. Download a backup first.</p><label>Type DELETE to confirm</label><input id="deleteDataConfirm" placeholder="DELETE"><button type="button" id="deleteDataBtn" style="margin-top:10px;background:#b91c1c;color:white">Delete Data</button><span id="deleteDataMsg" class="msg"></span></div>`;
$("settingsForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const {error}=await db.from("businesses").update({name:f.get("name"),phone:f.get("phone")||null,address:f.get("address")||null,currency:f.get("currency"),logo_url:f.get("logo_url")||null}).eq("id",business.id);if(error)throw error;await loadBusiness();say("settingsMsg","Settings saved.")}catch(err){say("settingsMsg",err.message)}};
$("backupDataBtn").onclick=async()=>{const btn=$("backupDataBtn");btn.disabled=true;say("dataToolsMsg","Creating backup…");try{const tables=["products","suppliers","customers","employees","purchases","sales","expenses"];const backup={app:"WIZO OMEGA POS",version:1,business_id:business.id,created_at:new Date().toISOString(),data:{}};for(const table of tables){const {data,error}=await db.from(table).select("*").eq("business_id",business.id);if(error&&error.code!=="42P01")throw error;backup.data[table]=data||[]}const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="WIZO_OMEGA_POS_backup_"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url);say("dataToolsMsg","Backup downloaded.")}catch(err){say("dataToolsMsg","Backup failed: "+(err.message||err))}finally{btn.disabled=false}};
$("restoreDataBtn").onclick=async()=>{const file=$("restoreDataFile").files[0];if(!file){say("dataToolsMsg","Choose a backup JSON file first.");return}if(!confirm("Restore records from this backup? Existing records with the same IDs may be updated."))return;const btn=$("restoreDataBtn");btn.disabled=true;say("dataToolsMsg","Restoring backup…");try{const backup=JSON.parse(await file.text());if(backup.app!=="WIZO OMEGA POS"||!backup.data||!backup.business_id)throw new Error("This is not a valid WIZO OMEGA POS backup.");const tables=["products","suppliers","customers","employees","purchases","sales","expenses"];for(const table of tables){const rows=backup.data[table]||[];if(!rows.length)continue;if(rows.some(r=>r.business_id!==business.id))throw new Error("Backup belongs to a different business. Restore stopped.");const {error}=await db.from(table).upsert(rows,{onConflict:"id"});if(error)throw new Error(table+": "+error.message)}say("dataToolsMsg","Restore finished. Refresh the page to see restored data.")}catch(err){say("dataToolsMsg","Restore failed: "+(err.message||err))}finally{btn.disabled=false}};
$("deleteDataBtn").onclick=async()=>{
  if($("deleteDataConfirm").value.trim()!=="DELETE"){say("deleteDataMsg",'Type DELETE exactly to confirm.');return}
  if(!confirm("FINAL WARNING: This permanently deletes all sales, purchases, purchase items, expenses, employees, products/menu items, customers, suppliers, and budget history for THIS business. The business profile/settings and your login account will remain. Continue?"))return;
  const btn=$("deleteDataBtn");btn.disabled=true;say("deleteDataMsg","Deleting business data…");
  try{
    // Delete child rows first, then their parent rows, to respect foreign keys.
    // Every database delete is scoped to the current business only.
    for(const table of ["wizo_held_sales","sale_items","purchase_items","sales","purchases","expenses","employees","customers","suppliers","products"]){
      const {error}=await db.from(table).delete().eq("business_id",business.id);
      if(error&&error.code!=="42P01")throw new Error(table+": "+error.message);
    }
    // Remove this business's cloud budget/history only after the owner confirms Delete Data.
    for(const table of ["wizo_budget_history","wizo_budgets"]){const {error}=await db.from(table).delete().eq("business_id",business.id);if(error)throw new Error(table+": "+error.message)}
    // Menu remains browser-local; clear the old local budget copies after cloud deletion succeeds.
    localStorage.removeItem(`wizo_menu_items_${business.id}`);
    localStorage.removeItem(`wizo_budget_${business.id}`);
    localStorage.removeItem(`wizo_budget_history_${business.id}`);
    $("deleteDataConfirm").value="";
    say("deleteDataMsg","Finished. Sales and sale items, purchases and purchase items, expenses, employees, products/menu, customers, suppliers and budget are cleared for this business. Business name, settings and login account remain. Local menu data on other devices is not affected. Refresh the page to see the clean state.");
  }catch(err){say("deleteDataMsg","Delete stopped part-way through: "+(err.message||err)+". Some records may already have been deleted; check the data before retrying.")}
  finally{btn.disabled=false}
};
}
(async()=>{if(!db){say("authMsg","Supabase library failed to load. Check internet.");return}const {data:{session}}=await db.auth.getSession();if(session){try{await boot()}catch(err){$("auth").hidden=false;$("shell").hidden=true;say("authMsg",err.message)}}})();
