p:auto}.main{padding:14px 22px 22px;min-width:0;max-width:1700px;width:100%;margin:0 auto;align-self:start}.topbar{margin-top:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.topbar h2{margin:0;font-size:25px}.topbar-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}.top-logout{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;font-weight:700;padding:8px 13px;white-space:nowrap}.top-logout:hover{background:#fecaca}.chip{border:1px solid var(--line);border-radius:22px;padding:8px 12px;color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;min-width:0}.stat small{color:var(--muted)}.stat strong{display:block;font-size:23px;margin-top:8px;overflow-wrap:anywhere}.layout2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted)}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed #3b4a3e;border-radius:9px}.pos{display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(300px,1fr);gap:14px}.categories{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.categories button{font-size:12px;padding:8px 10px}.menuitems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.menuitem{min-height:68px;text-align:center;font-weight:800;background:var(--lime);color:#15220d;border:0}.menuitem:nth-child(5n+2){background:var(--cyan);color:#102222}.menuitem:nth-child(5n+3){background:var(--blue);color:#fff}.menuitem:nth-child(5n+4){background:#42cf82;color:#10281a}.menuitem:nth-child(5n){background:var(--pink);color:#321222}.cartrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:7px;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}.cartrow button{padding:5px 9px}.total{font-size:22px;color:var(--gold);font-weight:900}.actionbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actionbar button{flex:1}.hidden{display:none!important}.notice{padding:10px 12px;background:#26372a;border:1px solid #4b654d;border-radius:9px;margin-bottom:12px;color:#d9f1d5}.receipt{background:#fff;color:#17211b;padding:22px 18px;width:100%;max-width:360px;margin:0 auto;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.45;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 8px 24px #0001}.receipt .receipt-brand{text-align:center;border-bottom:1px dashed #9ca3af;padding-bottom:12px;margin-bottom:12px}.receipt .receipt-brand h2{font-size:20px;letter-spacing:.5px;margin:0 0 5px;color:#111827;overflow-wrap:anywhere}.receipt .receipt-brand p{margin:2px 0;color:#4b5563;overflow-wrap:anywhere}.receipt .receipt-meta{display:grid;gap:4px;margin:10px 0}.receipt .receipt-meta div{display:flex;justify-content:space-between;gap:12px}.receipt .receipt-meta span:first-child{color:#6b7280}.receipt .receipt-items{width:100%;border-collapse:collapse;margin:10px 0}.receipt .receipt-items th{font-size:10px;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #d1d5db;padding:6px 2px}.receipt .receipt-items td{padding:8px 2px;border-bottom:1px dashed #e5e7eb;white-space:normal}.receipt .receipt-items th:last-child,.receipt .receipt-items td:last-child{text-align:right}.receipt .receipt-totals{border-top:1px dashed #9ca3af;padding-top:9px;margin-top:8px}.receipt .receipt-totals div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.receipt .receipt-totals .grand{font-size:17px;font-weight:800;color:#111827;border-top:1px solid #d1d5db;margin-top:5px;padding-top:9px}.receipt .receipt-thanks{text-align:center;border-top:1px dashed #9ca3af;margin-top:14px;padding-top:12px;color:#374151}.receipt .receipt-print{display:block;margin:12px auto 0;background:#e5e7eb;color:#111827;border:1px solid #d1d5db}.receipt .receipt-print{display:none}@media(max-width:900px){.shell{grid-template-columns:1fr}aside{padding:10px}.sidefoot{margin-top:0}nav{display:flex;overflow:auto}nav button{white-space:nowrap}.main{padding:13px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.pos,.layout2{grid-template-columns:1fr}}@media(max-width:480px){.formgrid{grid-template-columns:1fr}.menuitems{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{align-items:flex-start;flex-direction:column}.stat strong{font-size:19px}}

<body>
<section id="auth" class="auth"><div class="authcard"><div class="logo">WΩ</div><p class="gold" style="margin-top:16px;letter-spacing:2px;font-size:11px">SALES · RESTAURANT · BUSINESS</p><h1>WIZO <span class="gold">OMEGA POS</span></h1><p class="muted">Manage your business from one place.</p><div class="tabs"><button id="signinTab" class="active" type="button">Sign in</button><button id="signupTab" type="button">Create account</button></div><form id="authForm"><div id="businessField" class="hidden"><label>Business / Restaurant name</label><input id="businessName" autocomplete="organization" placeholder="Your business name"></div><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters"><button id="authSubmit" class="primary" style="width:100%;margin-top:16px" type="submit">Sign in</button><div id="authMsg" class="msg"></div></form></div></section>
<div id="shell" class="shell" hidden><aside><div class="brand">WΩ WIZO OMEGA</div><nav id="nav"><button data-page="Dashboard" class="active">▦ Dashboard</button><button data-page="POS">▣ POS / New Sale</button><button data-page="Products">◫ Menu</button><button data-page="Purchases">⇩ Purchases</button><button data-page="Expenses">↗ Expenses</button><button data-page="Customers">♙ Customers</button><button data-page="Suppliers">♧ Suppliers</button><button data-page="Sales">▤ Sales History</button><button data-page="Reports">▥ Reports</button><button data-page="Cashier Management">♙ Cashier Management</button><button data-page="Employees">♧ Employees</button><button data-page="Budget">▤ Budget</button><button data-page="Settings">⚙ Settings</button></nav></aside><main class="main"><div class="topbar"><div><p class="gold" style="font-size:10px;letter-spacing:2px;margin-bottom:4px">BUSINESS MANAGEMENT</p><h2 id="pageTitle">Dashboard</h2></div><div class="topbar-actions"><span id="businessChip" class="chip">My Business</span><button id="logout" class="top-logout" type="button">↪ Sign out</button></div></div><div id="appNotice"></div><section id="content"></section></main></div>
<div id="printArea" class="hidden"></div>
<script>
const SUPABASE_URL="https://hgwotfexwdctqjprkbst.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_4SgxZyVh3qSwdFwpPf03CQ_yfF0W95e";
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);let authMode="signin",currentUser=null,business=null,currentRole="owner",products=[],cart=[],pageNow="Dashboard",profile={name:"",phone:"",address:"",logo_url:"",currency:"ETB"};
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:profile.currency||"ETB"}).format(Number(n||0));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function say(id,msg){if($(id))$(id).textContent=msg}
function setAuthMode(m){authMode=m;$("signinTab").classList.toggle("active",m==="signin");$("signupTab").classList.toggle("active",m==="signup");$("businessField").classList.toggle("hidden",m!=="signup");$("businessName").required=m==="signup";$("authSubmit").textContent=m==="signin"?"Sign in":"Create account";say("authMsg",m==="signup"?"Enter your business name, email and password.":"")}
$("signinTab").onclick=()=>setAuthMode("signin");$("signupTab").onclick=()=>setAuthMode("signup");
$("authForm").onsubmit=async e=>{e.preventDefault();if(!db){say("authMsg","Supabase library did not load. Check your internet connection.");return}const btn=$("authSubmit");btn.disabled=true;say("authMsg","Please wait…");try{const email=$("email").value.trim(),password=$("password").value;if(authMode==="signin"){const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await boot()}else{const name=$("businessName").value.trim();if(!name)throw Error("Enter your business name.");const {data,error}=await db.auth.signUp({email,password,options:{data:{business_name:name},emailRedirectTo:location.href.split("#")[0]}});if(error)throw error;if(!data.session){say("authMsg","Account created. Check your email confirmation, then sign in. Business profile will be created automatically after confirmation.");return}await boot()}}catch(err){say("authMsg",err.message||"Could not sign in/create account.")}finally{btn.disabled=false}};
$("logout").onclick=async()=>{await db.auth.signOut();currentUser=null;business=null;currentRole="owner";products=[];cart=[];$("shell").hidden=true;$("auth").hidden=false;setAuthMode("signin")};
$("nav").onclick=e=>{const b=e.target.closest("[data-page]");if(b)showPage(b.dataset.page)};
async function boot(){const {data:{user},error}=await db.auth.getUser();if(error)throw error;if(!user)return;currentUser=user;$("auth").hidden=true;$("shell").hidden=false;await loadBusiness();await showPage("Dashboard")}
async function loadBusiness(){
  const {data:membership,error:memberError}=await db.from("business_members")
    .select("business_id,role").eq("user_id",currentUser.id).limit(1).maybeSingle();
  if(memberError)throw memberError;
  if(!membership)throw Error("Your account is not linked to a business. Ask the business owner to add your account.");
  currentRole=String(membership.role||"cashier").toLowerCase();
  const {data,error}=await db.from("businesses").select("*").eq("id",membership.business_id).maybeSingle();
  if(error)throw error;
  if(!data)throw Error("Business profile not found for your account.");
  business=data;profile={...profile,...data};
  $("businessChip").textContent=(data.name||currentUser.email)+" · "+currentRole.toUpperCase();
  applyRoleAccess();
}
function isOwnerRole(){return ["owner","admin"].includes(currentRole)}
function applyRoleAccess(){
  const allowed=isOwnerRole()?["Dashboard","POS","Products","Purchases","Expenses","Customers","Suppliers","Sales","Reports","Cashier Management","Employees","Budget","Settings"]:["POS","Sales"];
  document.querySelectorAll("#nav button[data-page]").forEach(b=>{
    const ok=allowed.includes(b.dataset.page);
    b.hidden=!ok;
    b.disabled=!ok;
  });
  if(!allowed.includes(pageNow))pageNow="POS";
}
function showNotice(msg){$("appNotice").innerHTML=msg?`<div class="notice">${esc(msg)}</div>`:""}
async function showPage(p){
  const cashierAllowed=["POS","Sales"];
  if(!isOwnerRole()&&!cashierAllowed.includes(p)){showNotice("This page is available to Owner/Admin only.");p="POS";}
  pageNow=p;$("pageTitle").textContent=p;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
  showNotice("");
  try{if(p==="Dashboard")await dashboard();else if(p==="POS")await renderPOS();else if(p==="Products")await productsPage();else if(p==="Purchases")await purchasesPage();else if(p==="Expenses")await expensesPage();else if(p==="Customers")await simpleDirectory("Customers");else if(p==="Suppliers")await simpleDirectory("Suppliers");else if(p==="Sales")await salesPage();else if(p==="Reports")await reportsPage();else if(p==="Cashier Management")await cashierManagementPage();else if(p==="Employees")await employeesPage();else if(p==="Budget")await budgetPage();else if(p==="Settings")settingsPage()}
  catch(err){showNotice(err.message||String(err));$("content").innerHTML=`<div class="panel"><h3>Unable to load this page</h3><p>${esc(err.message||String(err))}</p></div>`}
}
async function q(table,select="*"){const {data,error}=await db.from(table).select(select).order("created_at",{ascending:false});if(error)throw error;return data||[]}
async function dashboard(){const [sales,expenses,purchases]=await Promise.all([q("sales"),q("expenses"),q("purchases")]);const totalSales=sales.filter(s=>s.status==="completed").reduce((a,s)=>a+Number(s.total||0),0),directPurchaseCost=expenses.filter(e=>String(e.category||"").toLowerCase()==="direct purchase").reduce((a,e)=>a+Number(e.amount||0),0),purchaseCost=purchases.reduce((a,s)=>a+Number(s.total_cost||0),0)+directPurchaseCost,expenseCost=expenses.reduce((a,s)=>a+Number(s.amount||0),0),profit=sales.filter(s=>s.status==="completed").reduce((a,s)=>a+Number(s.total||0)-Number(s.cost_total||0),0)-expenseCost;const budgetKey=`wizo_budget_${business.id}`,budgetAmount=Math.max(0,Number(localStorage.getItem(budgetKey)||0)),budgetBalance=budgetAmount-purchaseCost;$("content").innerHTML=`<div class="stats"><div class="stat"><small>TOTAL SALES</small><strong>${money(totalSales)}</strong></div><div class="stat"><small>PURCHASE COST</small><strong>${money(purchaseCost)}</strong></div><div class="stat"><small>EST. NET PROFIT</small><strong>${money(profit)}</strong></div></div><div class="stats"><div class="stat"><small>BUDGET</small><strong>${money(budgetAmount)}</strong></div><div class="stat"><small>BUDGET PURCHASES</small><strong>${money(purchaseCost)}</strong></div><div class="stat"><small>BUDGET BALANCE</small><strong style="color:${budgetBalance<0?'var(--red)':'var(--lime)'}">${money(budgetBalance)}</strong></div><div class="stat"><small>EXPENSES</small><strong>${money(expenseCost)}</strong></div></div><div class="layout2"><div class="panel"><h3>Recent sales</h3>${tableHTML(sales.slice(0,6),["invoice_number","total","payment_method","created_at"])}</div><div class="panel"><h3>Quick actions</h3><div class="row"><button class="primary" data-goto="POS">＋ New sale</button><button data-goto="Products">＋ Edit Menu</button><button data-goto="Budget">▤ Set budget</button></div><p class="muted" style="margin-top:14px">Expenses: ${expenses.length}</p><p class="muted">Budget balance = Budget − Purchases.</p></div></div>`;bindGoto()}
function tableHTML(rows,cols){if(!rows.length)return '<div class="empty">No records yet.</div>';return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c.replaceAll("_"," "))}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c==="total"||c==="amount"||c==="total_cost"?money(r[c]):c==="created_at"?new Date(r[c]).toLocaleString():r[c]??"—")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function bindGoto(){$$(" [data-goto]".trim()).forEach(b=>b.onclick=()=>showPage(b.dataset.goto))}
function $$(s){return document.querySelectorAll(s)}
async function getProducts(){
  const fields=isOwnerRole()
    ?"id,business_id,name,sku,unit,stock_quantity,cost_price,selling_price,low_stock_threshold,created_at,updated_at,category"
    :"id,business_id,name,sku,unit,stock_quantity,selling_price,low_stock_threshold,created_at,updated_at,category";
  const {data,error}=await db.from("products").select(fields).eq("business_id",business.id).order("created_at",{ascending:false});
  if(error)throw error;products=data||[];return products;
}
async function productsPage(){
  const key=`wizo_menu_items_${business.id}`;
  const readMenu=()=>{try{return JSON.parse(localStorage.getItem(key)||"[]")}catch{return []}};
  let editingId=null,pictureData="";
  const resetForm=()=>{editingId=null;pictureData="";$("menuItemForm").reset();$("menuPicturePreview").textContent="Choose an image to preview it.";$("menuFormTitle").textContent="＋ Add Menu Item";$("menuSaveBtn").textContent="Save menu item";$("menuCancelEdit").classList.add("hidden")};
  const renderMenu=()=>{
    const items=readMenu();
    $("menuItemsCount").textContent=`Menu items (${items.length})`;
    $("menuItemsList").innerHTML=items.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px">${items.map(item=>`<article class="panel" style="padding:12px"><div style="height:130px;border-radius:9px;overflow:hidden;background:var(--panel2);display:grid;place-items:center;margin-bottom:10px">${item.image?`<img src="${item.image}" alt="${esc(item.name)}" style="width:100%;height:100%;object-fit:cover">`:`<span class="muted">No picture</span>`}</div><h3 style="margin-bottom:5px">${esc(item.name)}</h3><p class="muted" style="margin-bottom:6px">${esc(item.category||"Other")}</p><strong class="gold">${money(item.price)}</strong>${item.description?`<p class="muted" style="margin-top:8px;margin-bottom:8px">${esc(item.description)}</p>`:""}<p style="margin:8px 0"><span class="chip">${item.available?"Available":"Unavailable"}</span></p><div class="row"><button type="button" data-edit-menu="${esc(item.id)}">Edit</button><button type="button" class="danger" data-delete-menu="${esc(item.id)}">Delete</button></div></article>`).join("")}</div>`:`<div class="empty">No menu items yet. Add your first restaurant item above.</div>`;
    $("menuItemsList").querySelectorAll("[data-edit-menu]").forEach(btn=>btn.onclick=()=>{
      const item=readMenu().find(x=>String(x.id)===btn.dataset.editMenu);if(!item)return;
      editingId=item.id;pictureData=item.image||"";const f=$("menuItemForm");f.elements.name.value=item.name||"";f.elements.category.value=item.category||"Other";f.elements.price.value=item.price||"";f.elements.description.value=item.description||"";f.elements.available.value=item.available?"yes":"no";
      $("menuPicturePreview").innerHTML=pictureData?`<img src="${pictureData}" alt="Current menu picture" style="display:block;max-width:180px;max-height:130px;object-fit:cover;border-radius:8px"><span class="muted">Current picture (choose a new one to replace)</span>`:"No picture selected.";
      $("menuFormTitle").textContent="Edit Menu Item";$("menuSaveBtn").textContent="Save changes";$("menuCancelEdit").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"});
    });
    $("menuItemsList").querySelectorAll("[data-delete-menu]").forEach(btn=>btn.onclick=()=>{if(!confirm("Delete this menu item?"))return;localStorage.setItem(key,JSON.stringify(readMenu().filter(x=>String(x.id)!==btn.dataset.deleteMenu)));if(String(editingId)===btn.dataset.deleteMenu)resetForm();renderMenu()});
  };
  $("content").innerHTML=`<div class="panel"><h3 id="menuFormTitle">＋ Add Menu Item</h3><p class="muted">Add restaurant food and drinks here.</p><form id="menuItemForm"><div class="formgrid"><div><label>Menu item name *</label><input name="name" required placeholder="e.g. Chicken Pizza"></div><div><label>Category *</label><select name="category" required><option value="Pizza">Pizza</option><option value="Burger">Burger</option><option value="Shawarma">Shawarma</option><option value="Drinks">Drinks</option><option value="Breakfast">Breakfast</option><option value="Main dishes">Main dishes</option><option value="Dessert">Dessert</option><option value="Other">Other</option></select></div><div><label>Selling price (${esc(profile.currency||"ETB")}) *</label><input name="price" type="number" min="0.01" step=".01" required placeholder="0.00"></div><div><label>Food picture (laptop / phone)</label><input id="menuPicture" name="picture" type="file" accept="image/*"><div id="menuPicturePreview" class="muted" style="margin-top:7px;font-size:12px">Choose an image to preview it.</div></div><div style="grid-column:1/-1"><label>Description (optional)</label><textarea name="description" rows="2" placeholder="Ingredients or short description"></textarea></div><div><label>Availability</label><select name="available"><option value="yes">Available on menu</option><option value="no">Temporarily unavailable</option></select></div></div><button id="menuSaveBtn" class="primary" style="margin-top:15px" type="submit">Save menu item</button> <button id="menuCancelEdit" type="button" class="hidden">Cancel edit</button><span id="menuItemMsg" class="msg"></span></form></div><div class="panel"><h3 id="menuItemsCount">Menu items (0)</h3><div id="menuItemsList"></div></div>`;
  $("menuCancelEdit").onclick=resetForm;
  $("menuPicture").onchange=e=>{
    const file=e.target.files?.[0];if(!file)return;

function addToCart(id){

      const {error:itemDeleteError}=await db.from("purchase_items").delete().eq("purchase_id",p.id).eq("business_id",business.id);if(itemDeleteError)throw itemDeleteError;
      const {error}=await db.from("purchases").delete().eq("id",p.id).eq("business_id",business.id);if(error)throw error;
      await purchasesPage();say("purchaseHistoryMsg","Purchase deleted.");
    }catch(err){btn.disabled=false;alert("Could not delete purchase: "+(err.message||err))}
  });
  $("purchaseForm").onsubmit=async e=>{
    e.preventDefault();const f=new FormData(e.currentTarget);
    try{
      if($("purchaseNoStock").checked){
        const qty=Number(f.get("quantity")), unitCost=Number(f.get("unit_cost"));
        if(!(qty>0)||unitCost<0)throw new Error("Enter a valid quantity and unit cost.");
        const total=qty*unitCost+Number(f.get("transport_cost")||0)+Number(f.get("loading_cost")||0);
        const productName=String(f.get("product_name")||"").trim();
        if(!productName)throw new Error("Enter the product name.");
        const {error}=await db.from("expenses").insert({business_id:business.id,description:"Direct purchase: "+productName,amount:total,category:"Direct purchase"});
        if(error)throw error;
        say("purchaseMsg","Direct purchase recorded without changing stock.");await purchasesPage();
      }else{
        const productName=String(f.get("product_name")||"").trim();
        if(!productName)throw new Error("Enter the product name.");
        let product=prods.find(p=>String(p.name||"").trim().toLowerCase()===productName.toLowerCase());
        if(!product){
          const row={business_id:business.id,name:productName,unit:String(f.get("unit")||"piece"),stock_quantity:0,cost_price:Number(f.get("unit_cost")||0),selling_price:0,low_stock_threshold:0};
          const {data:created,error:createError}=await db.from("products").insert(row).select("id,name").single();
          if(createError)throw createError;
          product=created;
        }
        let supplierId=null;
        const supplierName=String(f.get("supplier_name")||"").trim();
        if(supplierName){
          const {data:existingSuppliers,error:supplierQueryError}=await db.from("suppliers").select("id,name").eq("business_id",business.id).ilike("name",supplierName).limit(1);
          if(supplierQueryError)throw supplierQueryError;
          if(existingSuppliers&&existingSuppliers.length)supplierId=existingSuppliers[0].id;
          else {const {data:newSupplier,error:newSupplierError}=await db.from("suppliers").insert({business_id:business.id,name:supplierName}).select("id").single();if(newSupplierError)throw newSupplierError;supplierId=newSupplier.id;}
        }
        const {data,error}=await db.rpc("wizo_record_purchase",{p_business_id:business.id,p_product_id:product.id,p_quantity:Number(f.get("quantity")),p_unit_cost:Number(f.get("unit_cost")),p_supplier_id:supplierId,p_transport_cost:Number(f.get("transport_cost")||0),p_loading_cost:Number(f.get("loading_cost")||0)});
        if(error)throw error;say("purchaseMsg","Purchase saved.");await purchasesPage()
      }
    }catch(err){say("purchaseMsg",err.message)}
  }
}

      if(!confirm(`Delete employee "${r.full_name}"? This only deletes this employee record.`))return;
      btn.disabled=true;
      try{const {error}=await db.from("employees").delete().eq("id",r.id).eq("business_id",business.id);if(error)throw error;await employeesPage();say("employeeListMsg","Employee deleted.");}
      catch(err){btn.disabled=false;say("employeeListMsg","Could not delete employee: "+(err.message||err));}
    });
  };
  $("employeeResetTop").onclick=reset;$("employeeCancelBtn").onclick=reset;$("employeeSearch").oninput=renderRows;
  form.onsubmit=async e=>{
    e.preventDefault();
    const f=new FormData(form),id=String(f.get("id")||"").trim();
    const name=String(f.get("full_name")||"").trim(),position=String(f.get("position")||"").trim();
    const salaryText=String(f.get("salary")||"").trim(),salary=salaryText===""?null:Number(salaryText);
    if(!name||!position){say("employeeMsg","Enter the employee name and job title.");return}
    if(salary!==null&&(!Number.isFinite(salary)||salary<0)){say("employeeMsg","Salary must be zero or a positive amount.");return}
    const payload={business_id:business.id,full_name:name,phone:String(f.get("phone")||"").trim()||null,email:String(f.get("email")||"").trim()||null,position,salary,hire_date:String(f.get("hire_date")||"").trim()||null,status:String(f.get("status")||"active"),notes:String(f.get("notes")||"").trim()||null};
    const btn=$("employeeSaveBtn");btn.disabled=true;say("employeeMsg",id?"Saving changes…":"Saving employee…");
    try{
      if(id){const {error}=await db.from("employees").update(payload).eq("id",id).eq("business_id",business.id);if(error)throw error;}
      else {const {error}=await db.from("employees").insert(payload);if(error)throw error;}
      await employeesPage();say("employeeMsg",id?"Employee updated successfully.":"Employee saved successfully.");
    }catch(err){say("employeeMsg","Could not save employee: "+(err.message||err));}
    finally{if($("employeeSaveBtn"))$("employeeSaveBtn").disabled=false}
  };
  renderRows();
}

async function budgetPage(){
  if(!isOwnerRole())throw Error("Owner/Admin only.");

  const revenue=completed.reduce((a,x)=>a+Number(x.total||0),0),expenseTotal=expenses.reduce((a,x)=>a+Number(x.amount||0),0),directPurchaseTotal=expenses.filter(x=>String(x.category||"").toLowerCase()==="direct purchase").reduce((a,x)=>a+Number(x.amount||0),0),purchaseTotal=purchases.reduce((a,x)=>a+Number(x.total_cost||0),0)+directPurchaseTotal;
  const key=`wizo_budget_${business.id}`,saved=localStorage.getItem(key)||"0",budgetAmount=Math.max(0,Number(saved)||0),balance=budgetAmount-purchaseTotal;

style="margin-top:8px">View Dashboard</button></div></div><div class="panel"><h3>Budget History</h3><p class="muted">Previous budget amounts and changes saved in this browser for this business.</p><div id="budgetHistoryEditor" class="panel hidden" style="margin-bottom:14px;background:var(--panel2)"></div><div id="budgetHistory"></div></div>`;
  const percent=budgetAmount>0?Math.min(100,purchaseTotal/budgetAmount*100):0;
  $("budgetBar").style.width=percent+"%";$("budgetProgress").textContent=budgetAmount>0?`${percent.toFixed(1)}% of budget used · Balance: ${money(balance)}`:"Enter a budget amount to calculate the balance.";
  const historyKey=`wizo_budget_history_${business.id}`;
  const renderBudgetHistory=()=>{let history=[];try{history=JSON.parse(localStorage.getItem(historyKey)||"[]")}catch{};const el=$("budgetHistory");if(!history.length){el.innerHTML='<p class="muted">No budget changes recorded yet. Save a budget to start the history.</p>';return}el.innerHTML=`<div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Budget name</th><th>Previous budget</th><th>Added amount</th><th>New total</th><th>Notes</th><th>Actions</th></tr></thead><tbody>${history.map((h,i)=>`<tr><td>${esc(h.dateOnly||new Date(h.date).toLocaleDateString())}</td><td>${esc(h.name||"Budget")}</td><td>${money(h.previous)}</td><td style="color:var(--green, #15803d)">+${money(h.added??(Number(h.amount)-Number(h.previous)))}</td><td>${money(h.amount)}</td><td>${esc(h.notes||"—")}</td><td><div class="row"><button type="button" data-edit-budget-history="${i}">Edit</button><button type="button" class="danger" data-delete-budget-history="${i}">Delete</button></div></td></tr>`).join("")}</tbody></table></div>`;
 el.querySelectorAll("[data-edit-budget-history]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.editBudgetHistory);let list=[];try{list=JSON.parse(localStorage.getItem(historyKey)||"[]")}catch{};const h=list[i];if(!h)return;const editor=$("budgetHistoryEditor");editor.classList.remove("hidden");editor.innerHTML=`<h3>Edit budget history entry</h3><form id="budgetHistoryEditForm"><div class="formgrid"><div><label>Previous budget (${esc(profile.currency||"ETB")})</label><input name="previous" type="number" min="0" step=".01" value="${esc(h.previous)}" required></div><div><label>New budget (${esc(profile.currency||"ETB")})</label><input name="amount" type="number" min="0" step=".01" value="${esc(h.amount)}" required></div><div><label>Date & time</label><input name="date" type="datetime-local" value="${esc(new Date(h.date).toISOString().slice(0,16))}" required></div></div><div class="row" style="margin-top:12px"><button class="primary" type="submit">Save changes</button><button type="button" id="cancelBudgetHistoryEdit">Cancel</button></div><span id="budgetHistoryEditMsg" class="msg"></span></form>`;const f=$("budgetHistoryEditForm");$("cancelBudgetHistoryEdit").onclick=()=>editor.classList.add("hidden");f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f),prev=Number(fd.get("previous")),amount=Number(fd.get("amount")),date=new Date(fd.get("date"));if(!Number.isFinite(prev)||prev<0||!Number.isFinite(amount)||amount<0||Number.isNaN(date.getTime())){say("budgetHistoryEditMsg","Enter valid values for all fields.");return}list[i]={...h,previous:prev,amount,date:date.toISOString()};localStorage.setItem(historyKey,JSON.stringify(list));editor.classList.add("hidden");renderBudgetHistory()};editor.scrollIntoView({behavior:"smooth",block:"start"})});
  el.querySelectorAll("[data-delete-budget-history]").forEach(b=>b.onclick=()=>{
    const i=Number(b.dataset.deleteBudgetHistory);
    let list=[];try{list=JSON.parse(localStorage.getItem(historyKey)||"[]")}catch{}
    const entry=list[i];if(!entry)return;
    const isLatest=i===0;
    const promptText=isLatest
      ?"Delete the latest budget history entry? The current budget will return to the previous amount shown in this entry."
      :"Delete this older budget history entry? The current budget amount will stay unchanged.";
    if(!confirm(promptText))return;
    list.splice(i,1);
    localStorage.setItem(historyKey,JSON.stringify(list));
    if(isLatest){
      const restored=Math.max(0,Number(entry.previous)||0);
      localStorage.setItem(key,String(restored));
      $("budgetTarget").value=String(restored);
      const pct=restored>0?Math.min(100,purchaseTotal/restored*100):0;
      $("budgetBar").style.width=pct+"%";
      $("budgetProgress").textContent=restored>0?`${pct.toFixed(1)}% of budget used · Balance: ${money(restored-purchaseTotal)}`:"Enter a budget amount to calculate the balance.";
      const stats=$("content").querySelectorAll(".stats .stat strong");
      if(stats[0])stats[0].textContent=money(restored);
      if(stats[2]){stats[2].textContent=money(restored-purchaseTotal);stats[2].style.color=(restored-purchaseTotal)<0?"var(--red)":"var(--lime)"}
    }
    renderBudgetHistory();
    say("budgetMsg",isLatest?"Latest history deleted. Budget restored to the previous amount.":"History entry deleted. Current budget unchanged.");
  });
 };
  renderBudgetHistory();
  $("budgetDashboard").onclick=()=>showPage("Dashboard");
  $("budgetForm").onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),added=Math.max(0,Number(f.get("amount"))||0),name=String(f.get("budget_name")||"").trim(),dateOnly=String(f.get("date")||""),notes=String(f.get("notes")||"").trim(),previous=Math.max(0,Number(localStorage.getItem(key)||0));if(!name||!dateOnly||!(added>0)){say("budgetMsg","Enter budget name, date, and an amount greater than zero.");return}const total=previous+added;let history=[];try{history=JSON.parse(localStorage.getItem(historyKey)||"[]")}catch{};history.unshift({date:new Date(dateOnly+"T12:00:00").toISOString(),dateOnly,name,notes,previous,added,amount:total});localStorage.setItem(historyKey,JSON.stringify(history.slice(0,100)));localStorage.setItem(key,String(total));$("budgetTarget").value="";$("budgetName").value="";$("budgetNotes").value="";say("budgetMsg","Budget added successfully. Total budget: "+money(total));const pct=total>0?Math.min(100,purchaseTotal/total*100):0;$("budgetBar").style.width=pct+"%";$("budgetProgress").textContent=total>0?`${pct.toFixed(1)}% of budget used · Balance: ${money(total-purchaseTotal)}`:"Enter a budget amount to calculate the balance.";const stats=$("content").querySelectorAll(".stats .stat strong");if(stats[0])stats[0].textContent=money(total);if(stats[2]){stats[2].textContent=money(total-purchaseTotal);stats[2].style.color=(total-purchaseTotal)<0?"var(--red)":"var(--lime)"}renderBudgetHistory()};
}
function settingsPage(){$("content").innerHTML=`<div class="panel"><h3>Business / receipt settings</h3><form id="settingsForm"><div class="formgrid"><div><label>Business name</label><input name="name" required value="${esc(profile.name||"")}"></div><div><label>Phone</label><input name="phone" value="${esc(profile.phone||"")}"></div><div><label>Address</label><input name="address" value="${esc(profile.address||"")}"></div><div><label>Currency</label><select name="currency"><option ${profile.currency==="ETB"?"selected":""}>ETB</option><option ${profile.currency==="SAR"?"selected":""}>SAR</option><option ${profile.currency==="USD"?"selected":""}>USD</option></select></div><div style="grid-column:1/-1"><label>Logo image URL (optional)</label><input name="logo_url" value="${esc(profile.logo_url||"")}"></div></div><button class="primary" style="margin-top:14px">Save settings</button><span id="settingsMsg" class="msg"></span></form><p class="muted">These details are used on receipts. The logo URL must be a publicly accessible image URL.</p></div>
<div class="panel"><h3>Backup & Restore Data</h3><p class="muted">Download a backup of this business data or restore from a WIZO OMEGA POS JSON backup file.</p><button type="button" class="primary" id="backupDataBtn">Download Backup</button> <label for="restoreDataFile" class="btn">Choose backup file</label><input id="restoreDataFile" type="file" accept=".json,application/json" style="display:none"><button type="button" id="restoreDataBtn">Restore Data</button><span id="dataToolsMsg" class="msg"></span></div>
<div class="panel"><h3>Delete Business Data</h3><p class="muted">This permanently deletes sales, purchases and purchase items, expenses, employees, products/menu items, customers, suppliers, and all budget amounts/history for this business. Business name, business settings, and login account are kept. Download a backup first.</p><label>Type DELETE to confirm</label><input id="deleteDataConfirm" placeholder="DELETE"><button type="button" id="deleteDataBtn" style="margin-top:10px;background:#b91c1c;color:white">Delete Data</button><span id="deleteDataMsg" class="msg"></span></div>`;
$("settingsForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const {error}=await db.from("businesses").update({name:f.get("name"),phone:f.get("phone")||null,address:f.get("address")||null,currency:f.get("currency"),logo_url:f.get("logo_url")||null}).eq("id",business.id);if(error)throw error;await loadBusiness();say("settingsMsg","Settings saved.")}catch(err){say("settingsMsg",err.message)}};
$("backupDataBtn").onclick=async()=>{const btn=$("backupDataBtn");btn.disabled=true;say("dataToolsMsg","Creating backup…");try{const tables=["products","suppliers","customers","employees","purchases","sales","expenses"];const backup={app:"WIZO OMEGA POS",version:1,business_id:business.id,created_at:new Date().toISOString(),data:{}};for(const table of tables){const {data,error}=await db.from(table).select("*").eq("business_id",business.id);if(error&&error.code!=="42P01")throw error;backup.data[table]=data||[]}const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="WIZO_OMEGA_POS_backup_"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url);say("dataToolsMsg","Backup downloaded.")}catch(err){say("dataToolsMsg","Backup failed: "+(err.message||err))}finally{btn.disabled=false}};
$("restoreDataBtn").onclick=async()=>{const file=$("restoreDataFile").files[0];if(!file){say("dataToolsMsg","Choose a backup JSON file first.");return}if(!confirm("Restore records from this backup? Existing records with the same IDs may be updated."))return;const btn=$("restoreDataBtn");btn.disabled=true;say("dataToolsMsg","Restoring backup…");try{const backup=JSON.parse(await file.text());if(backup.app!=="WIZO OMEGA POS"||!backup.data||!backup.business_id)throw new Error("This is not a valid WIZO OMEGA POS backup.");const tables=["products","suppliers","customers","employees","purchases","sales","expenses"];for(const table of tables){const rows=backup.data[table]||[];if(!rows.length)continue;if(rows.some(r=>r.business_id!==business.id))throw new Error("Backup belongs to a different business. Restore stopped.");const {error}=await db.from(table).upsert(rows,{onConflict:"id"});if(error)throw new Error(table+": "+error.message)}say("dataToolsMsg","Restore finished. Refresh the page to see restored data.")}catch(err){say("dataToolsMsg","Restore failed: "+(err.message||err))}finally{btn.disabled=false}};
$("deleteDataBtn").onclick=async()=>{
  if($("deleteDataConfirm").value.trim()!=="DELETE"){say("deleteDataMsg",'Type DELETE exactly to confirm.');return}
  if(!confirm("FINAL WARNING: This permanently deletes all sales, purchases, purchase items, expenses, employees, products/menu items, customers, suppliers, and budget history for THIS business. The business profile/settings and your login account will remain. Continue?"))return;
  const btn=$("deleteDataBtn");btn.disabled=true;say("deleteDataMsg","Deleting business data…");
  try{
    // Delete child rows first, then their parent rows, to respect foreign keys.
    // Every database delete is scoped to the current business only.
    for(const table of ["sale_items","purchase_items","sales","purchases","expenses","employees","customers","suppliers","products"]){
      const {error}=await db.from(table).delete().eq("business_id",business.id);
      if(error&&error.code!=="42P01")throw new Error(table+": "+error.message);
    }
    // Menu and budget history are stored locally per business in this browser.
    localStorage.removeItem(`wizo_menu_items_${business.id}`);
    localStorage.removeItem(`wizo_budget_${business.id}`);
    localStorage.removeItem(`wizo_budget_history_${business.id}`);
    $("deleteDataConfirm").value="";
    say("deleteDataMsg","Finished. Sales and sale items, purchases and purchase items, expenses, employees, products/menu, customers, suppliers and budget are cleared for this business. Business name, settings and login account remain. Local menu/budget data on other devices is not affected. Refresh the page to see the clean state.");
  }catch(err){say("deleteDataMsg","Delete stopped part-way through: "+(err.message||err)+". Some records may already have been deleted; check the data before retrying.")}
  finally{btn.disabled=false}
};
}
