<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WIZO OMEGA POS</title><style>
:root{--bg:#0c0d0f;--panel:#17191c;--line:#303238;--gold:#d8b35a;--text:#f7f4ed;--muted:#a5a7ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 15px}button:focus-visible,input:focus-visible{outline:2px solid var(--gold)}[hidden]{display:none!important}.gold,span{color:var(--gold)}.muted{color:var(--muted)}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#292315,#0c0d0f 60%)}.card{width:min(100%,440px);padding:34px;background:#151618;border:1px solid #39332a;border-radius:22px;box-shadow:0 25px 70px #0008}.logo{font-size:26px;font-weight:900;color:var(--gold);border:1px solid var(--gold);border-radius:14px;width:60px;padding:10px;text-align:center;margin-bottom:22px}.gold{font-size:11px;font-weight:800;letter-spacing:2px}.card h1{font-size:25px}.tabs{display:flex;gap:5px;background:#242528;padding:4px;border-radius:12px;margin:22px 0}.tabs button{flex:1;background:transparent;color:#aaa}.tabs button.active,.primary{background:var(--gold);color:#17130a;font-weight:800}label{display:block;font-size:12px;margin:13px 0 6px}input,select{width:100%;padding:12px;background:#0f1012;border:1px solid #3a3c42;border-radius:10px;color:white}.primary{width:100%;margin-top:18px}#msg{color:var(--gold);font-size:13px;min-height:18px}#app{min-height:100vh;grid-template-columns:235px 1fr}#app:not([hidden]){display:grid}aside{padding:22px 14px;background:#111214;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:25px}.brand{padding:10px;color:var(--gold)}nav{display:grid;gap:6px}nav button,aside>button{background:transparent;color:#bbb;text-align:left}nav button:hover,nav button.active{background:#29251b;color:var(--gold)}aside>button{margin-top:auto;border:1px solid var(--line)}main{padding:28px;min-width:0;max-width:1500px;width:100%;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}h2{font-size:28px;margin:0}.chip{border:1px solid var(--line);padding:8px 13px;border-radius:30px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.panel{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:15px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:8px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.panel{margin-bottom:18px}.panel h3{margin-top:0}.muted{color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px 14px}.formgrid label{margin-top:10px}.actions{display:flex;gap:10px;margin-top:18px}.secondary{background:#282a2e;color:white;border:1px solid #3a3d42}.empty{padding:24px;border:1px dashed #444;border-radius:10px;text-align:center;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.tablewrap{overflow:auto}footer{margin-top:32px;padding:18px 0;border-top:1px solid var(--line);color:#777;font-size:11px}@media(max-width:850px){#app:not([hidden]){grid-template-columns:1fr}aside{padding:12px;gap:10px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}aside>button{margin-top:0}main{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:520px){.formgrid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.card{padding:25px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><section id="auth" class="auth"><div class="card"><div class="logo">WΩ</div><p class="gold">SALES · INVENTORY · BUSINESS</p><h1>WIZO <span>OMEGA</span> POS</h1><p class="muted">Manage your business from one place.</p><div class="tabs"><button id="signintab" class="active">Sign in</button><button id="signuptab">Create account</button></div><form id="form"><label id="businesslabel" hidden>Business name</label><input id="business" placeholder="Business name" hidden><label>Email</label><input id="email" type="email" required placeholder="you@example.com"><label>Password</label><input id="password" type="password" minlength="8" required placeholder="At least 8 characters"><button class="primary" id="submit">Sign in</button><p id="msg"></p></form></div></section>
<div id="app" hidden><aside><div class="brand">WΩ <b>WIZO OMEGA</b></div><nav><button data-page="Dashboard">▦ Dashboard</button><button data-page="Sales">▣ Sales</button><button data-page="Products">◫ Products & Stock</button><button data-page="Purchases">⇩ Purchases</button><button data-page="Expenses">↗ Expenses</button><button data-page="Reports">▤ Reports</button><button data-page="Settings">⚙ Settings</button></nav><button id="logout">Sign out</button></aside><main><header><div><p class="gold">BUSINESS MANAGEMENT</p><h2 id="title">Dashboard</h2></div><span id="businessname" class="chip">My Business</span></header><div id="notice"></div><section id="content"></section><footer>WIZO OMEGA POS · Sales, inventory and business management</footer></main></div><script>
// Browser-safe Supabase publishable key only. Never add a service_role/secret key here.
const URL="https://hgwotfexwdctqjprkbst.supabase.co";
const KEY="sb_publishable_4SgxZyVh3qSwdFwpPf03CQ_yfF0W95e";
const db=window.supabase?.createClient(URL,KEY);
const $=id=>document.getElementById(id);let mode="signin",user=null;
function authMode(m){mode=m;$("signintab").classList.toggle("active",m==="signin");$("signuptab").classList.toggle("active",m==="signup");$("business").hidden=m!=="signup";$("businesslabel").hidden=m!=="signup";$("business").required=m==="signup";$("submit").textContent=m==="signin"?"Sign in":"Create account";$("msg").textContent=""}
$("signintab").onclick=()=>authMode("signin");$("signuptab").onclick=()=>authMode("signup");
$("form").onsubmit=async e=>{e.preventDefault();if(!db)return;$("submit").disabled=true;$("msg").textContent="Please wait…";try{let email=$("email").value.trim(),password=$("password").value;if(mode==="signin"){let{error}=await db.auth.signInWithPassword({email,password});if(error)throw error}else{let{data,error}=await db.auth.signUp({email,password,options:{data:{business_name:$("business").value.trim()}}});if(error)throw error;if(!data.session){$("msg").textContent="Account created. Check your email to confirm, then sign in.";return}}await startApp()}catch(err){$("msg").textContent=err.message||"Unable to continue"}finally{$("submit").disabled=false}};
$("logout").onclick=async()=>{await db.auth.signOut();$("app").hidden=true;$("auth").hidden=false;authMode("signin")};
$("app").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b)render(b.dataset.page)});
function money(n){return new Intl.NumberFormat("en-US",{style:"currency",currency:"ETB"}).format(Number(n||0))}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function startApp(){let{data:{user:u}}=await db.auth.getUser();if(!u)return;user=u;$("auth").hidden=true;$("app").hidden=false;$("businessname").textContent=u.user_metadata?.business_name||u.email;render("Dashboard")}
function render(page){$("title").textContent=page;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));if(page==="Dashboard"){$("content").innerHTML=`<div class="stats"><div class="stat"><small>TOTAL SALES</small><strong>ETB 0.00</strong></div><div class="stat"><small>PURCHASE COST</small><strong>ETB 0.00</strong></div><div class="stat"><small>NET PROFIT</small><strong>ETB 0.00</strong></div><div class="stat"><small>STOCK PRODUCTS</small><strong>0</strong></div></div><div class="grid"><div class="panel"><h3>Recent sales</h3><div class="empty">No sales recorded yet.</div></div><div class="panel"><h3>Quick actions</h3><button class="primary" data-page="Products">＋ Add product</button><p class="muted">Add stock before recording sales.</p></div></div>`}else if(page==="Products"){$("content").innerHTML=`<div class="panel"><h3>Add a product</h3><form id="productform"><div class="formgrid"><div><label>Product name *</label><input name="name" required></div><div><label>SKU / Barcode</label><input name="sku"></div><div><label>Unit</label><select name="unit"><option>piece</option><option>kg</option><option>gram</option><option>liter</option><option>box</option><option>carton</option></select></div><div><label>Opening stock</label><input name="stock" type="number" min="0" step=".001" value="0" required></div><div><label>Purchase cost (ETB)</label><input name="cost" type="number" min="0" step=".01" value="0" required></div><div><label>Selling price (ETB)</label><input name="price" type="number" min="0" step=".01" value="0" required></div></div><button class="primary">Save product</button><p id="productmsg"></p></form></div><div class="panel"><h3>Inventory</h3><div id="products" class="empty">Loading products…</div></div>`;$("productform").onsubmit=saveProduct;loadProducts()}else{$("content").innerHTML=`<div class="panel"><h3>${safe(page)}</h3><p class="muted">${page==="Sales"?"Checkout, invoice creation and stock deduction will be added after the database foundation is confirmed.":page==="Purchases"?"Purchase entry and automatic stock updates are the next implementation step.":page==="Expenses"?"Expense tracking will be connected to the database next.":page==="Reports"?"Reports will calculate sales, stock and profit from saved transactions.":"Business profile, receipt logo, contact details and permissions will be configured here."}</p></div>`}}
async function saveProduct(e){e.preventDefault();let f=new FormData(e.currentTarget),msg=$("productmsg");try{let{data:business,error:be}=await db.from("businesses").select("id").limit(1).maybeSingle();if(be)throw be;if(!business){msg.textContent="No business profile found yet. The secure business signup step must be set up first.";return}let row={business_id:business.id,name:String(f.get("name")).trim(),sku:String(f.get("sku")||"").trim()||null,unit:f.get("unit"),stock_quantity:Number(f.get("stock")),cost_price:Number(f.get("cost")),selling_price:Number(f.get("price"))};let{error}=await db.from("products").insert(row);if(error)throw error;msg.textContent="Product saved.";e.currentTarget.reset();loadProducts()}catch(err){msg.textContent=err.message}}
async function loadProducts(){let target=$("products");if(!target)return;try{let{data,error}=await db.from("products").select("name,sku,unit,stock_quantity,cost_price,selling_price").order("created_at",{ascending:false});if(error)throw error;if(!data?.length){target.className="empty";target.textContent="No products yet.";return}target.className="tablewrap";target.innerHTML=`<table><thead><tr><th>Product</th><th>SKU</th><th>Stock</th><th>Cost</th><th>Price</th></tr></thead><tbody>${data.map(p=>`<tr><td>${safe(p.name)}</td><td>${safe(p.sku||"—")}</td><td>${safe(p.stock_quantity)} ${safe(p.unit)}</td><td>${money(p.cost_price)}</td><td>${money(p.selling_price)}</td></tr>`).join("")}</tbody></table>`}catch(err){target.className="empty";target.textContent="Database setup required: "+err.message}}
(async()=>{if(!db){$("msg").textContent="Supabase library could not load. Check internet.";return}let{data:{session}}=await db.auth.getSession();if(session)await startApp()})();
</script></body></html>
